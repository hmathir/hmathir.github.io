<p class="intro">রাসুলুল্লাহ <span class="saw">ﷺ</span> বলেছেন: “সকালে ও সন্ধ্যায় <b>কুল হুওয়াল্লাহু আহাদ</b> এবং <b>মুআওয়িযাতাইন</b> (ফালাক ও নাস) তিনবার করে পড়ো, এগুলো সব কিছু থেকে তোমার জন্য যথেষ্ট হবে।” <small>(আবু দাউদ ৫০৮২, তিরমিজি ৩৫৭৫; আলবানি: হাসান)</small></p>

  </div>

  <div class="row"><span class="lbl">উচ্চারণ</span><p class="tr" >কুল হুওয়াল্লা-হু আহাদ। আল্লা-হুস সামাদ। লাম ইয়ালিদ, ওয়া লাম ইউলাদ। ওয়া লাম ইয়াকুল লাহু কুফুওয়ান আহাদ।</p></div><div class="row"><span class="lbl">অর্থ</span><p class="mn">বলো, তিনি আল্লাহ, এক ও অদ্বিতীয়। আল্লাহ কারো মুখাপেক্ষী নন, সবাই তাঁর মুখাপেক্ষী। তিনি কাউকে জন্ম দেননি, আর কেউ তাঁকে জন্ম দেয়নি। তাঁর সমকক্ষ কেউ নেই।</p></div><p class="src">সূত্র: সূরা আল-ইখলাস ১১২:১–৪</p>

  <div class="row"><span class="lbl">উচ্চারণ</span><p class="tr" >আল্লা-হু লা ইলা-হা ইল্লা হুওয়াল হাইয়্যুল ক্বাইয়্যূম। লা তা’খুযুহূ সিনাতুঁও ওয়ালা নাওম। লাহূ মা ফিস সামা-ওয়া-তি ওয়ামা ফিল আরদ্ব। মান যাল্লাযি ইয়াশফাউ ইনদাহূ ইল্লা বিইযনিহ। ইয়া’লামু মা বাইনা আইদীহিম ওয়ামা খালফাহুম। ওয়ালা ইউহীতূনা বিশাইয়িম মিন ইলমিহী ইল্লা বিমা শা-আ। ওয়াসিআ কুরসিয়্যুহুস সামা-ওয়া-তি ওয়াল আরদ্ব। ওয়ালা ইয়াঊদুহূ হিফযুহুমা, ওয়া হুওয়াল আলিয়্যুল আযীম।</p></div><div class="row"><span class="lbl">অর্থ</span><p class="mn">আল্লাহ, তিনি ছাড়া কোনো ইলাহ নেই। তিনি চিরঞ্জীব, সব কিছুর ধারক। তন্দ্রা বা ঘুম তাঁকে স্পর্শ করে না। আসমান ও জমিনে যা কিছু আছে সব তাঁরই। তাঁর অনুমতি ছাড়া কে আছে যে তাঁর কাছে সুপারিশ করবে? মানুষের সামনে ও পেছনে যা আছে তিনি সব জানেন। তিনি যতটুকু চান, তার বাইরে তাঁর জ্ঞানের কিছুই তারা আয়ত্ত করতে পারে না। তাঁর কুরসি আসমান ও জমিন জুড়ে বিস্তৃত, আর এ দুটোর রক্ষণাবেক্ষণ তাঁকে ক্লান্ত করে না। তিনি সর্বোচ্চ, মহান।</p></div><p class="src">সূত্র: সূরা আল-বাকারা ২:২৫৫। ঘুমানোর আগে পড়লে সকাল পর্যন্ত আল্লাহর পক্ষ থেকে একজন হেফাজতকারী থাকে এবং শয়তান কাছে আসতে পারে না (সহিহ বুখারি ৫০১০)। সকাল-সন্ধ্যায় পড়ার বর্ণনা: মুস্তাদরাকে হাকিম, আলবানি সহিহ বলেছেন (সহিহ আত-তারগিব)।</p>

<p class="intro" id="barakah">রাসুলুল্লাহ <span class="saw">ﷺ</span> বলেছেন: “তোমাদের কেউ যখন নিজের মধ্যে, নিজের সম্পদে কিংবা তার ভাইয়ের মধ্যে মুগ্ধ হওয়ার মতো কিছু দেখে, সে যেন তার জন্য বরকতের দোয়া করে, কেননা বদনজর সত্য।” <small>(মুসনাদে আহমাদ, ইবনে মাজাহ, মুয়াত্তা মালিক; আলবানি: সহিহ)</small></p>
<section class="card"><div class="head"><div class="num"><span>৬</span></div><h2>নিজের বা অন্যের নেয়ামত দেখে মুগ্ধ হলে</h2></div>

<div class="tip green"><b>মনে রাখুন</b><p>নজর সত্য, তবে আল্লাহর হেফাজত তার চেয়েও বড়। ভয় না পেয়ে নিয়মিত আমল করুন, নেয়ামতের জন্য শুকরিয়া আদায় করুন, আর অন্যের ভালো কিছু দেখলে হিংসা না করে তার জন্য বরকতের দোয়া করুন। কল্যাণ ও অকল্যাণের মালিক একমাত্র আল্লাহ।</p></div>

  <div class="badge">Morning 3× · Evening 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Transliteration</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Meaning</span><p class="mn">In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.</p></div><p class="src">Source: Abu Dawud 5088, at-Tirmidhi 3388; graded sahih by al-Albani. Virtue: whoever says it three times in the morning will not be struck by sudden affliction until evening, and three times in the evening, until morning.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Refuge from the evil of creation</h2></div>
  <div class="badge">Evening 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Transliteration</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Meaning</span><p class="mn">I seek refuge in the perfect words of Allah from the evil of what He has created.</p></div><p class="src">Source: Sahih Muslim 2709; three times: at-Tirmidhi 3604.</p>
</section>
<p class="intro" id="family">The Messenger of Allah <span class="saw">ﷺ</span> used to seek refuge for al-Hasan and al-Husayn with this dua, saying that their forefather Ibrahim used to seek refuge with it for Isma‘il and Ishaq. <small>(Sahih al-Bukhari 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>For yourself</h2></div>
  <div class="badge">Any time</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliteration</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Meaning</span><p class="mn">I seek refuge in the perfect words of Allah from every devil and every poisonous creature, and from every harmful evil eye.</p></div><p class="src">Source: Sahih al-Bukhari 3371</p>
</section>
<section class="card" id="family-kids">
  <div class="head"><div class="num"><span>5</span></div><h2>For your children & family</h2></div>
  <div class="badge">Recite over them</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliteration</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Meaning</span><p class="mn">I place you both under the protection of the perfect words of Allah from every devil and every poisonous creature, and from every harmful evil eye.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>for one boy</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>for one girl</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>for two (wording of the hadith)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>for three or more</small></div></div><p class="src">Source: at-Tirmidhi 2060 (graded sahih by al-Albani); original account in Sahih al-Bukhari 3371</p>
</section>
<p class="intro" id="barakah">The Messenger of Allah <span class="saw">ﷺ</span> said: when one of you sees something that pleases him in himself, his wealth or his brother, let him pray for blessing for it, for the evil eye is real. <small>(Musnad Ahmad, Ibn Majah, Muwatta Malik; graded sahih by al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>When you admire your own or someone else's blessing</h2></div>
  <div class="badge">Right away</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">What Allah wills [has happened]; there is no power except with Allah.</p><p class="src c">Surah al-Kahf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">O Allah, bless it.</p><p class="src c">For someone else: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>Remember</b><p>The evil eye is real, but Allah's protection is greater. Don't live in fear: keep up these adhkar, be grateful for your blessings, and when you see good in others, pray for blessing instead of envying. All good and harm is in Allah's hands alone.</p></div>

  <h1>التحصين من <span>العين والحسد</span></h1>
  <p class="sub">أذكار الصباح والمساء الصحيحة · مع التلاوة</p>
  <div class="when"><div><b>أذكار الصباح</b><span>من الفجر إلى طلوع الشمس</span></div><div><b>أذكار المساء</b><span>من العصر إلى المغرب</span></div></div>

<p class="intro">قال رسول الله <span class="saw">ﷺ</span>: «قُلْ هُوَ اللَّهُ أَحَدٌ وَالْمُعَوِّذَتَيْنِ حِينَ تُمْسِي وَحِينَ تُصْبِحُ ثَلَاثَ مَرَّاتٍ تَكْفِيكَ مِنْ كُلِّ شَيْءٍ» <small>(أبو داود ٥٠٨٢، الترمذي ٣٥٧٥؛ حسّنه الألباني)</small></p>

<p class="intro" id="family">كان النبي <span class="saw">ﷺ</span> يعوّذ الحسن والحسين بهذا الدعاء، ويقول: إن أباكما كان يعوّذ بها إسماعيل وإسحاق. <small>(صحيح البخاري ٣٣٧١)</small></p>

<section class="card"><div class="head"><div class="num"><span>٦</span></div><h2>إذا رأيت من نعمتك أو نعمة غيرك ما يعجبك</h2></div>

  <div class="row"><span class="lbl">Transliterasi</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Arti</span><p class="mn">Allah, tidak ada tuhan selain Dia. Yang Mahahidup, Yang terus menerus mengurus (makhluk-Nya), tidak mengantuk dan tidak tidur. Milik-Nya apa yang ada di langit dan apa yang ada di bumi. Tidak ada yang dapat memberi syafaat di sisi-Nya tanpa izin-Nya. Dia mengetahui apa yang dihadapan mereka dan apa yang di belakang mereka, dan mereka tidak mengetahui sesuatu apa pun tentang ilmu-Nya melainkan apa yang Dia kehendaki. Kursi-Nya96) meliputi langit dan bumi. Dan Dia tidak merasa berat memelihara keduanya, dan Dia Mahatinggi, Mahabesar</p></div><p class="src">Sumber: Surah al-Baqarah 2:255. Siapa membacanya sebelum tidur, ia senantiasa dijaga oleh Allah dan setan tidak mendekatinya hingga pagi (Shahih al-Bukhari 5010). Riwayat pagi & petang: al-Mustadrak al-Hakim, dinilai sahih oleh al-Albani (Shahih at-Targhib).</p>
</section>
<p class="note-h">Doa-doa berikut berasal dari hadis (bukan ayat Al-Qur'an), sehingga tidak disertai audio bacaan. Bacalah dengan bantuan transliterasi.</p>
<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Doa agar tidak ada yang membahayakan</h2></div>
  <div class="badge">Pagi 3× · Petang 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Transliterasi</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Arti</span><p class="mn">Dengan nama Allah, yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat membahayakan, dan Dia Maha Mendengar lagi Maha Mengetahui.</p></div><p class="src">Sumber: Abu Dawud 5088, at-Tirmidzi 3388; sahih menurut al-Albani. Keutamaan: siapa membacanya tiga kali di pagi hari tidak akan tertimpa musibah mendadak hingga petang, dan tiga kali di petang hari, hingga pagi.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Berlindung dari keburukan makhluk</h2></div>
  <div class="badge">Petang 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Transliterasi</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Arti</span><p class="mn">Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari keburukan apa yang Dia ciptakan.</p></div><p class="src">Sumber: Shahih Muslim 2709; tiga kali: at-Tirmidzi 3604.</p>
</section>
<p class="intro" id="family">Rasulullah <span class="saw">ﷺ</span> memohonkan perlindungan untuk al-Hasan dan al-Husain dengan doa ini, dan bersabda bahwa leluhur mereka, Ibrahim, memohonkan perlindungan untuk Isma‘il dan Ishaq dengan doa ini. <small>(Shahih al-Bukhari 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>Untuk diri sendiri</h2></div>
  <div class="badge">Kapan saja</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliterasi</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Arti</span><p class="mn">Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari setiap setan dan binatang berbisa, dan dari setiap 'ain yang membahayakan.</p></div><p class="src">Sumber: Shahih al-Bukhari 3371</p>
</section>
<section class="card" id="family-kids">
  <div class="head"><div class="num"><span>5</span></div><h2>Untuk anak & keluarga</h2></div>
  <div class="badge">Dibacakan untuk mereka</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliterasi</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Arti</span><p class="mn">Aku memohonkan perlindungan untuk kalian berdua dengan kalimat-kalimat Allah yang sempurna dari setiap setan dan binatang berbisa, dan dari setiap 'ain yang membahayakan.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>untuk satu anak laki-laki</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>untuk satu anak perempuan</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>untuk dua orang (lafaz hadis)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>untuk tiga orang atau lebih</small></div></div><p class="src">Sumber: at-Tirmidzi 2060 (sahih menurut al-Albani); kisah asal dalam Shahih al-Bukhari 3371</p>
</section>
<p class="intro" id="barakah">Rasulullah <span class="saw">ﷺ</span> bersabda: jika salah seorang dari kalian melihat sesuatu yang mengagumkan pada dirinya, hartanya atau saudaranya, hendaklah ia mendoakan keberkahan untuknya, karena 'ain itu benar adanya. <small>(Musnad Ahmad, Ibnu Majah, al-Muwaththa'; sahih menurut al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Saat mengagumi nikmat sendiri atau orang lain</h2></div>
  <div class="badge">Seketika</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Atas kehendak Allah [semua ini terwujud]; tidak ada kekuatan kecuali dengan pertolongan Allah.</p><p class="src c">Surah al-Kahfi 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Ya Allah, berkahilah.</p><p class="src c">Untuk orang lain: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>Ingatlah</b><p>'Ain itu nyata, tetapi perlindungan Allah lebih besar. Jangan hidup dalam ketakutan: rutinkan zikir, syukuri nikmat, dan bila melihat kebaikan pada orang lain, doakan keberkahan, jangan dengki. Manfaat dan mudarat hanya di tangan Allah.</p></div>

  <div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Allah, O'ndan başka tanrı olmayan, kendisini uyuklama ve uyku tutmayan, diri, her an yaratıklarını gözetip durandır. Göklerde olan ve yerde olan ancak O'nundur. O'nun izni olmadan katında şefaat edecek kimdir? Onların işlediklerini ve işleyeceklerini bilir, dilediğinden başka ilminden hiçbir şeyi kavrayamazlar. Hükümranlığı gökleri ve yeri kaplamıştır, onların gözetilmesi O'na ağır gelmez. O yücedir, büyüktür</p></div><p class="src">Kaynak: Bakara 2:255. Yatarken okuyan kimse için sabaha kadar Allah tarafından bir koruyucu bulunur ve şeytan ona yaklaşamaz (Sahîh-i Buhârî 5010). Sabah-akşam okunmasına dair rivayet: Hâkim, el-Müstedrek; Elbânî sahih demiştir (Sahîhu’t-Terğîb).</p>

<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Hiçbir şeyin zarar vermemesi için dua</h2></div>
  <div class="badge">Sabah 3 · Akşam 3</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Adıyla birlikte yerde ve gökte hiçbir şeyin zarar veremeyeceği Allah’ın adıyla. O, her şeyi işiten ve bilendir.</p></div><p class="src">Kaynak: Ebû Dâvûd 5088, Tirmizî 3388; Elbânî: sahih. Fazileti: Sabah üç kez okuyana akşama kadar, akşam üç kez okuyana sabaha kadar ani bir belâ isabet etmez.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Yaratılanların şerrinden sığınma</h2></div>
  <div class="badge">Akşam 3 kez</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Yarattığı şeylerin şerrinden Allah’ın eksiksiz kelimelerine sığınırım.</p></div><p class="src">Kaynak: Sahîh-i Müslim 2709; üç kez: Tirmizî 3604.</p>
</section>
<p class="intro" id="family">Resûlullah <span class="saw">ﷺ</span> Hasan ve Hüseyin’i bu dua ile Allah’a emanet eder ve atalarının, İbrâhim’in, İsmâil ile İshak’ı bununla Allah’a sığındırdığını söylerdi. <small>(Sahîh-i Buhârî 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>Kendin için</h2></div>
  <div class="badge">Her zaman</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Her şeytandan, her zehirli hayvandan ve zarar veren her nazardan Allah’ın eksiksiz kelimelerine sığınırım.</p></div><p class="src">Kaynak: Sahîh-i Buhârî 3371</p>
</section>
<section class="card" id="family-kids">

  <div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Sizi her şeytandan, her zehirli hayvandan ve zarar veren her nazardan Allah’ın eksiksiz kelimelerine sığındırırım.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>bir erkek çocuk için</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>bir kız çocuk için</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>iki kişi için (hadisteki lafız)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>üç veya daha fazla kişi için</small></div></div><p class="src">Kaynak: Tirmizî 2060 (Elbânî: sahih); asıl olay Sahîh-i Buhârî 3371</p>

<p class="intro" id="barakah">Resûlullah <span class="saw">ﷺ</span> şöyle buyurdu: Biriniz kendisinde, malında veya kardeşinde hoşuna giden bir şey gördüğünde ona bereket duası etsin; çünkü nazar haktır. <small>(Müsned-i Ahmed, İbn Mâce, Muvatta; Elbânî: sahih)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Kendi veya başkasının nimeti hoşuna gittiğinde</h2></div>
  <div class="badge">Hemen</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Allah dilemiş, kuvvet ancak Allah’ındır.</p><p class="src c">Kehf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Allah’ım, bunu bereketli kıl.</p><p class="src c">Başkası için: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>Unutma</b><p>Nazar haktır, ama Allah’ın koruması daha büyüktür. Korku içinde yaşama: zikirlere devam et, nimetlere şükret ve başkasında bir iyilik gördüğünde haset etmek yerine bereket duası et. Fayda da zarar da yalnızca Allah’ın elindedir.</p></div>

<div class="tip"><b>La manière de la Sunna</b><p>Avant de dormir, le Messager d’Allah <span class="saw">ﷺ</span> joignait ses mains, soufflait dedans, récitait al-Ikhlas, al-Falaq et an-Nas, puis passait ses mains sur ce qu’il pouvait de son corps, en commençant par la tête, le visage et le devant du corps. Il le faisait trois fois. <small>(Sahih al-Bukhari 5017)</small></p></div>
<section class="card" id="kursi">
  <div class="head"><div class="num"><span>2</span></div><h2>Ayat al-Kursi</h2></div>
  <div class="badge">Matin · Soir · Avant de dormir</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۚ وَهُوَ ٱلْعَلِىُّ <span class="nw">ٱلْعَظِيمُ&nbsp;<span class="am">﴿٢٥٥﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/002255.mp3"]'>
    <button class="play" type="button"><span class="ic">▶</span><span class="tx">Écouter la récitation</span></button>
    <div class="rep"><button type="button" data-r="1" class="on">1×</button><button type="button" data-r="3">3×</button></div>
    <div class="prog"><i></i></div><div class="cnt"></div>
  </div>
  <p class="hint">Touchez un verset pour n’écouter que celui-ci</p>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Allah! Point de divinité à part Lui, le Vivant, Celui qui subsiste par lui-même «Al-Qayyûm». Ni somnolence ni sommeil ne Le saisissent. A Lui appartient tout ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission? Il connaît leur passé et leur futur. Et, de Sa science, ils n'embrassent que ce qu'Il veut. Son Trône «Kursiy», déborde les cieux et la terre, dont la garde ne Lui coûte aucune peine. Et Il est le Très Haut, le Très Grand</p></div><p class="src">Source: Sourate al-Baqara 2:255. Celui qui le récite avant de dormir a un gardien de la part d’Allah jusqu’au matin, et Satan ne l’approche pas (Sahih al-Bukhari 5010). Récitation matin & soir : al-Mustadrak d’al-Hakim, jugé authentique par al-Albani (Sahih at-Targhib).</p>
</section>
<p class="note-h">Les invocations ci-dessous proviennent des hadiths (ce ne sont pas des versets du Coran) ; aucun audio de récitation n’est donc joint.</p>
<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Pour que rien ne puisse nuire</h2></div>
  <div class="badge">Matin 3× · Soir 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Au nom d’Allah, avec le nom duquel rien sur terre ni dans le ciel ne peut nuire, et Il est Celui qui entend tout, l’Omniscient.</p></div><p class="src">Source: Abu Dawud 5088, at-Tirmidhi 3388 ; authentique selon al-Albani. Mérite : qui la dit trois fois le matin ne sera pas frappé par un malheur soudain jusqu’au soir, et trois fois le soir, jusqu’au matin.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Refuge contre le mal de la création</h2></div>
  <div class="badge">Soir 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je cherche refuge auprès des paroles parfaites d’Allah contre le mal de ce qu’Il a créé.</p></div><p class="src">Source: Sahih Muslim 2709 ; trois fois : at-Tirmidhi 3604.</p>
</section>
<p class="intro" id="family">Le Messager d’Allah <span class="saw">ﷺ</span> plaçait al-Hasan et al-Husayn sous la protection d’Allah avec cette invocation, et disait que leur ancêtre Ibrahim protégeait ainsi Isma‘il et Ishaq. <small>(Sahih al-Bukhari 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>Pour soi-même</h2></div>
  <div class="badge">À tout moment</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je cherche refuge auprès des paroles parfaites d’Allah contre tout diable, toute bête venimeuse et tout mauvais œil nuisible.</p></div><p class="src">Source: Sahih al-Bukhari 3371</p>
</section>
<section class="card" id="family-kids">
  <div class="head"><div class="num"><span>5</span></div><h2>Pour ses enfants & sa famille</h2></div>
  <div class="badge">À réciter sur eux</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je vous place tous deux sous la protection des paroles parfaites d’Allah contre tout diable, toute bête venimeuse et tout mauvais œil nuisible.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>pour un garçon</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>pour une fille</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>pour deux (texte du hadith)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>pour trois ou plus</small></div></div><p class="src">Source: at-Tirmidhi 2060 (authentique selon al-Albani) ; récit d’origine : Sahih al-Bukhari 3371</p>
</section>
<p class="intro" id="barakah">Le Messager d’Allah <span class="saw">ﷺ</span> a dit : lorsque l’un de vous voit en lui-même, dans ses biens ou chez son frère quelque chose qui lui plaît, qu’il invoque la bénédiction pour cela, car le mauvais œil est une réalité. <small>(Musnad Ahmad, Ibn Majah, Muwatta Malik ; authentique selon al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Quand un bienfait (le vôtre ou celui d’autrui) vous plaît</h2></div>
  <div class="badge">Sur le moment</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Telle est la volonté d’Allah ; il n’y a de puissance que par Allah.</p><p class="src c">Sourate al-Kahf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Ô Allah, bénis-le.</p><p class="src c">Pour autrui : <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>À retenir</b><p>Le mauvais œil est réel, mais la protection d’Allah est plus grande. Ne vivez pas dans la peur : soyez assidu aux invocations, remerciez Allah pour Ses bienfaits, et quand vous voyez du bien chez autrui, invoquez la bénédiction au lieu d’envier. Le bien et le mal ne sont qu’entre les mains d’Allah.</p></div>

  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Bismillahir-Rahmanir-Rahim. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Di: "Me refugio en el Señor de los seres humanos en el Rey Soberano de los seres humanos en el [único] Dios de los seres humanos de la maldad del [demonio] susurrador que huye [cuando el nombre de Dios es mencionado] que susurra en los corazones de los seres humanos y existe entre los yinnes y entre los seres humanos</p></div><p class="src">Fuente: Sura an-Nas 114:1–6</p>

<div class="tip"><b>La forma de la Sunna</b><p>Antes de dormir, el Mensajero de Alá <span class="saw">ﷺ</span> juntaba las manos, soplaba en ellas, recitaba al-Ijlas, al-Falaq y an-Nas, y luego pasaba las manos por todo el cuerpo que podía, empezando por la cabeza, la cara y la parte delantera del cuerpo. Lo hacía tres veces. <small>(Sahih al-Bujari 5017)</small></p></div>
<section class="card" id="kursi">
  <div class="head"><div class="num"><span>2</span></div><h2>Ayat al-Kursi</h2></div>
  <div class="badge">Mañana · Tarde · Antes de dormir</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۚ وَهُوَ ٱلْعَلِىُّ <span class="nw">ٱلْعَظِيمُ&nbsp;<span class="am">﴿٢٥٥﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/002255.mp3"]'>
    <button class="play" type="button"><span class="ic">▶</span><span class="tx">Escuchar la recitación</span></button>
    <div class="rep"><button type="button" data-r="1" class="on">1×</button><button type="button" data-r="3">3×</button></div>
    <div class="prog"><i></i></div><div class="cnt"></div>
  </div>
  <p class="hint">Toca cualquier aleya para escuchar solo esa aleya</p>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">¡Dios! No existe nada ni nadie con derecho a ser adorado excepto Él, el Viviente [Eterno], el Sustentador [y Gobernador de toda la creación]. No Lo afectan somnolencia ni sueño. Suyo es cuanto hay en los cielos y la Tierra. ¿Quién podrá interceder ante Él si no es con Su permiso? Conoce el pasado y el futuro [lo manifiesto y lo oculto] y nadie abarca de Su conocimiento salvo lo que Él quiere. El escabel de Su Trono abarca los cielos y la Tierra, y la custodia [y mantenimiento] de ambos no Lo agobia. Y Él es el Sublime, el Grandioso</p></div><p class="src">Fuente: Sura al-Baqara 2:255. Quien la recita antes de dormir tiene un guardián de parte de Alá hasta la mañana y Satanás no se le acerca (Sahih al-Bujari 5010). Recitación de mañana y tarde: al-Mustadrak de al-Hakim, auténtico según al-Albani (Sahih at-Targhib).</p>
</section>
<p class="note-h">Las súplicas siguientes provienen de hadices (no son aleyas del Corán), por eso no incluyen audio de recitación.</p>
<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Para que nada pueda dañarte</h2></div>
  <div class="badge">Mañana 3× · Tarde 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">En el nombre de Alá, con cuyo nombre nada en la tierra ni en el cielo puede causar daño, y Él es el que todo lo oye, el que todo lo sabe.</p></div><p class="src">Fuente: Abu Dawud 5088, at-Tirmidhi 3388; auténtico según al-Albani. Virtud: quien la dice tres veces por la mañana no sufrirá una desgracia repentina hasta la tarde, y tres veces por la tarde, hasta la mañana.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Refugio del mal de la creación</h2></div>
  <div class="badge">Tarde 3×</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Me refugio en las palabras perfectas de Alá del mal de lo que Él ha creado.</p></div><p class="src">Fuente: Sahih Muslim 2709; tres veces: at-Tirmidhi 3604.</p>
</section>
<p class="intro" id="family">El Mensajero de Alá <span class="saw">ﷺ</span> ponía a al-Hasan y al-Husayn bajo la protección de Alá con esta súplica, y decía que su antepasado Ibrahim protegía así a Ismael e Isaac. <small>(Sahih al-Bujari 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>Para ti</h2></div>
  <div class="badge">En cualquier momento</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Me refugio en las palabras perfectas de Alá de todo demonio, de toda criatura venenosa y de todo mal de ojo dañino.</p></div><p class="src">Fuente: Sahih al-Bujari 3371</p>
</section>
<section class="card" id="family-kids">

  <div class="badge">Recítala sobre ellos</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Os pongo a ambos bajo la protección de las palabras perfectas de Alá de todo demonio, de toda criatura venenosa y de todo mal de ojo dañino.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>para un niño</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>para una niña</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>para dos (texto del hadiz)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>para tres o más</small></div></div><p class="src">Fuente: at-Tirmidhi 2060 (auténtico según al-Albani); relato original en Sahih al-Bujari 3371</p>
</section>
<p class="intro" id="barakah">El Mensajero de Alá <span class="saw">ﷺ</span> dijo: cuando alguno de vosotros vea en sí mismo, en sus bienes o en su hermano algo que le agrade, que pida bendición para ello, pues el mal de ojo es real. <small>(Musnad Ahmad, Ibn Mayah, Muwatta Malik; auténtico según al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Cuando admiras una bendición tuya o ajena</h2></div>
  <div class="badge">En el momento</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Lo que Alá quiere [sucede]; no hay poder sino en Alá.</p><p class="src c">Sura al-Kahf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Oh Alá, bendícelo.</p><p class="src c">Para otra persona: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>Recuerda</b><p>El mal de ojo es real, pero la protección de Alá es mayor. No vivas con miedo: sé constante con las súplicas, agradece tus bendiciones y, cuando veas algo bueno en otros, pide bendición en lugar de envidiar. El bien y el mal están solo en manos de Alá.</p></div>

  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Bismillahir-Rahmanir-Rahim. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Скажи: «Прибегаю к защите Господа людей Царя людей Бога людей от зла искусителя отступающего (или сжимающегося) при поминании Аллаха который наущает в груди людей и бывает из джиннов и людей»</p></div><p class="src">Источник: Сура ан-Нас 114:1–6</p>

<div class="tip"><b>Как делал Пророк</b><p>Перед сном Посланник Аллаха <span class="saw">ﷺ</span> складывал ладони, дул в них, читал суры аль-Ихлас, аль-Фалак и ан-Нас, а затем обтирал ими своё тело, сколько мог, начиная с головы, лица и передней части тела. Он делал это три раза. <small>(Сахих аль-Бухари 5017)</small></p></div>

  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Аллах - нет божества, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает. Его Престол (Подножие Трона) объемлет небеса и землю, и не тяготит Его оберегание их. Он - Возвышенный, Великий</p></div><p class="src">Источник: Сура аль-Бакара 2:255. Того, кто прочтёт его перед сном, до утра охраняет хранитель от Аллаха, и шайтан не приблизится к нему (Сахих аль-Бухари 5010). Чтение утром и вечером: «аль-Мустадрак» аль-Хакима, аль-Албани: достоверно (Сахих ат-Таргиб).</p>

<section class="card" id="bismillah">

  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.</p></div><p class="src">Источник: Абу Дауд 5088, ат-Тирмизи 3388; аль-Албани: достоверно. Достоинство: кто скажет это трижды утром, того до вечера не постигнет внезапное несчастье, а кто вечером — до утра.</p>

<p class="intro" id="barakah">Посланник Аллаха <span class="saw">ﷺ</span> сказал: если кто-то из вас увидит в себе, в своём имуществе или в своём брате то, что ему понравится, пусть попросит для этого благодати, ведь сглаз — истина. <small>(Муснад Ахмада, Ибн Маджа, Муватта Малика; аль-Албани: достоверно)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Когда восхищаешься своим или чужим благом</h2></div>

<div class="tip green"><b>Помните</b><p>Сглаз — истина, но защита Аллаха сильнее. Не живите в страхе: постоянно читайте азкары, благодарите за блага, а увидев добро у других, просите для них благодати, а не завидуйте. Польза и вред — только в руках Аллаха.</p></div>

<p class="intro">安拉的使者<span class="saw">ﷺ</span>说：“你在傍晚和早晨各诵读三遍<b>《忠诚章》</b>和<b>两个求护章</b>（《曙光章》与《世人章》），它们足以护佑你免遭一切。”<small>（艾布·达乌德 5082，提尔米济 3575；阿尔巴尼：良好）</small></p>

  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay bsm" data-k="0">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span><br> <span class="ay" data-k="1">قُلْ أَعُوذُ بِرَبِّ <span class="nw">ٱلنَّاسِ&nbsp;<span class="am">﴿١﴾</span></span></span> <span class="ay" data-k="2">مَلِكِ <span class="nw">ٱلنَّاسِ&nbsp;<span class="am">﴿٢﴾</span></span></span> <span class="ay" data-k="3">إِلَٰهِ <span class="nw">ٱلنَّاسِ&nbsp;<span class="am">﴿٣﴾</span></span></span> <span class="ay" data-k="4">مِن شَرِّ ٱلْوَسْوَاسِ <span class="nw">ٱلْخَنَّاسِ&nbsp;<span class="am">﴿٤﴾</span></span></span> <span class="ay" data-k="5">ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ <span class="nw">ٱلنَّاسِ&nbsp;<span class="am">﴿٥﴾</span></span></span> <span class="ay" data-k="6">مِنَ ٱلْجِنَّةِ <span class="nw">وَٱلنَّاسِ&nbsp;<span class="am">﴿٦﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/001001.mp3", "audio/114001.mp3", "audio/114002.mp3", "audio/114003.mp3", "audio/114004.mp3", "audio/114005.mp3", "audio/114006.mp3"]'>

  <p class="hint">点击任意一节经文，只播放该节</p>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Bismillahir-Rahmanir-Rahim. Qul a'udhu bi Rabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-waswasil-khannas. Alladhi yuwaswisu fi sudurin-nas. Minal-jinnati wan-nas.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">你说：“我求庇于世人的养主，世人的君主，世人的主宰，免遭潜伏的教唆者的毒害，他在世人的胸中教唆，他是属于精灵和人类的。</p></div><p class="src">出处: 《世人章》114:1–6</p>
</section>
<div class="tip"><b>圣行的做法</b><p>安拉的使者<span class="saw">ﷺ</span>睡前会合拢双手，向手中吹气，诵读《忠诚章》《曙光章》《世人章》，然后用双手尽可能抚摸全身，先从头部、面部和身体前面开始，如此做三遍。<small>（《布哈里圣训实录》5017）</small></p></div>
<section class="card" id="kursi">
  <div class="head"><div class="num"><span>2</span></div><h2>库尔西经文</h2></div>
  <div class="badge">早 · 晚 · 睡前</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۚ وَهُوَ ٱلْعَلِىُّ <span class="nw">ٱلْعَظِيمُ&nbsp;<span class="am">﴿٢٥٥﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/002255.mp3"]'>
    <button class="play" type="button"><span class="ic">▶</span><span class="tx">收听诵读</span></button>
    <div class="rep"><button type="button" data-r="1" class="on">1 遍</button><button type="button" data-r="3">3 遍</button></div>

  </div>
  <p class="hint">点击任意一节经文，只播放该节</p>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">安拉，除他外绝无应受崇拜的；他是永生不灭的，是维护万物的；瞌睡不能侵犯他，睡眠不能克服他；天地万物都是他的；不经他的许可，谁能在他那里替人说情呢？他知道他们面前的事，和他们身后的事；除他所启示的外，他们绝不能窥测他的玄妙；他的库尔西包罗天地。对天地的维持，不能使他疲倦。他确是至高无上的主，确是至大的主。</p></div><p class="src">出处: 《黄牛章》2:255。睡前诵读者，整夜直到天亮都有安拉派来的护卫，恶魔不能接近他（《布哈里圣训实录》5010）。早晚诵读的传述：哈基姆《补遗》，阿尔巴尼定为可靠（《劝善与警告·可靠篇》）。</p>
</section>
<p class="note-h">以下祈祷词出自圣训（并非《古兰经》经文），因此未附诵读音频。</p>
<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>使任何事物都无法伤害的祈祷</h2></div>
  <div class="badge">早 3 遍 · 晚 3 遍</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">奉安拉之名，凭着他的尊名，天地间任何事物都不能造成伤害；他是全聪的，全知的。</p></div><p class="src">出处: 艾布·达乌德 5088，提尔米济 3388；阿尔巴尼：可靠。贵重：早晨念三遍者，直到傍晚不会遭遇突然的灾祸；傍晚念三遍者，直到早晨亦然。</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>求护免遭被造物的伤害</h2></div>
  <div class="badge">傍晚 3 遍</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">我以安拉完美的言辞求护，免遭他所造之物的伤害。</p></div><p class="src">出处: 《穆斯林圣训实录》2709；三遍：提尔米济 3604。</p>
</section>
<p class="intro" id="family">安拉的使者<span class="saw">ﷺ</span>用这段祈祷为哈桑和侯赛因求护，并说他们的祖先易卜拉欣也曾用它为伊斯玛仪和伊斯哈格求护。<small>（《布哈里圣训实录》3371）</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>为自己</h2></div>
  <div class="badge">任何时候</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">我以安拉完美的言辞求护，免遭一切恶魔、一切毒物以及一切有害的毒眼。</p></div><p class="src">出处: 《布哈里圣训实录》3371</p>
</section>
<section class="card" id="family-kids">
  <div class="head"><div class="num"><span>5</span></div><h2>为孩子和家人</h2></div>
  <div class="badge">对着他们诵读</div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">我以安拉完美的言辞为你们二人求护，免遭一切恶魔、一切毒物以及一切有害的毒眼。</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>为一个男孩</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>为一个女孩</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>为两人（圣训原文）</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>为三人或以上</small></div></div><p class="src">出处: 提尔米济 2060（阿尔巴尼：可靠）；原始事件见《布哈里圣训实录》3371</p>
</section>
<p class="intro" id="barakah">安拉的使者<span class="saw">ﷺ</span>说：你们任何人在自己身上、财产上或兄弟身上看到令他喜欢的事物时，应当为之祈求吉庆，因为毒眼是真实的。<small>（《艾哈迈德穆斯奈德》、伊本·马哲、《穆宛塔》；阿尔巴尼：可靠）</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>欣赏自己或他人的恩典时</h2></div>
  <div class="badge">当下</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">这是安拉所意欲的；除凭安拉外，绝无任何能力。</p><p class="src c">《山洞章》18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">主啊，求你使它吉庆。</p><p class="src c">为他人： <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="tip green"><b>请记住</b><p>毒眼是真实的，但安拉的护佑更大。不要生活在恐惧中：坚持记念，感谢恩典；看到别人的好处时，为他祈求吉庆而不要嫉妒。祸福只在安拉手中。</p></div>

<script>
(function(){
  var au = new Audio(); au.preload = 'auto';
  var st = null, TX = {};
  var DIG = {bn:'০১২৩৪৫৬৭৮৯', ar:'٠١٢٣٤٥٦٧٨٩'};
  var cur = 'bn';
  function num(n){ var d = DIG[cur]; return d ? String(n).replace(/\d/g,function(x){return d[x]}) : String(n); }
  function setBtn(pl, playing){
    var b = pl.querySelector('.play');
    b.classList.toggle('on', playing);
    b.querySelector('.ic').textContent = playing ? '❚❚' : '▶';
    b.querySelector('.tx').textContent = playing ? TX.stop : TX.play;
  }
  function clearCur(card){ card.querySelectorAll('.ay.cur').forEach(function(e){e.classList.remove('cur')}) }
  function mark(){
    clearCur(st.card);
    var e = st.card.querySelector('.ay[data-k="'+st.idx+'"]'); if(e) e.classList.add('cur');
    st.pl.querySelector('.cnt').textContent = (!st.single && st.rep > 1) ? (num(st.done+1)+' / '+num(st.rep)+' '+TX.times) : '';
  }
  function stop(){
    if(!st) return;
    au.pause(); setBtn(st.pl,false); clearCur(st.card);
    st.pl.querySelector('.prog i').style.width='0'; st.pl.querySelector('.cnt').textContent='';
    st = null;
  }
  function playIdx(){
    au.src = st.files[st.idx]; mark();
    var p = au.play();
    if(p && p.catch) p.catch(function(){ var s=st; stop(); if(s){ var c=s.pl.querySelector('.cnt'); c.textContent=TX.err; c.className='cnt err'; } });
    setBtn(st.pl,true);
  }
  function start(pl, idx, single){
    if(st) stop();
    var c = pl.querySelector('.cnt'); c.className='cnt';
    st = {pl:pl, card:pl.closest('.card'), files:JSON.parse(pl.dataset.files), idx:idx, rep:+pl.querySelector('.rep .on').dataset.r, done:0, single:!!single};
    playIdx();
  }
  au.addEventListener('ended', function(){
    if(!st) return;
    if(st.single){ stop(); return; }
    st.idx++;
    if(st.idx < st.files.length){ playIdx(); return; }
    st.done++;
    if(st.done < st.rep){ st.idx = 0; playIdx(); return; }
    stop();
  });
  au.addEventListener('timeupdate', function(){
    if(!st || !au.duration) return;
    var f = st.single ? au.currentTime/au.duration : (st.idx + au.currentTime/au.duration)/st.files.length;
    st.pl.querySelector('.prog i').style.width = (f*100).toFixed(1)+'%';
  });
  function bind(root){
    root.querySelectorAll('.player').forEach(function(pl){
      pl.querySelector('.play').addEventListener('click', function(){
        if(st && st.pl === pl){
          if(au.paused){ var p=au.play(); if(p&&p.catch)p.catch(function(){}); setBtn(pl,true); }
          else { au.pause(); setBtn(pl,false); }
          return;
        }
        start(pl, 0, false);
      });
      pl.querySelectorAll('.rep button').forEach(function(b){
        b.addEventListener('click', function(){
          pl.querySelectorAll('.rep button').forEach(function(x){x.classList.remove('on')});
          b.classList.add('on');
          if(st && st.pl===pl){ st.rep = +b.dataset.r; if(st.done >= st.rep) st.done = st.rep-1; mark(); }
        });
      });
      pl.closest('.card').querySelectorAll('.ay').forEach(function(a){
        a.addEventListener('click', function(){ start(pl, +a.dataset.k, true); });
      });
    });
  }
  var main = document.getElementById('main'), sel = document.getElementById('lang');
  function setLang(code, keepScroll){
    var tp = document.getElementById('L-'+code); if(!tp){ code='bn'; tp=document.getElementById('L-bn'); }
    if(st) stop();
    cur = code;
    TX = {play:tp.dataset.play, stop:tp.dataset.stop, times:tp.dataset.times, err:tp.dataset.err};
    var y = window.scrollY;
    main.innerHTML = ''; main.appendChild(tp.content.cloneNode(true));
    document.documentElement.lang = code; document.documentElement.dir = tp.dataset.dir;
    document.getElementById('langlbl').textContent = tp.dataset.label;
    sel.value = code; bind(main);
    if(keepScroll) window.scrollTo(0, y);
  }
  function getSaved(){ try{ return localStorage.getItem('najar-lang'); }catch(e){ return null; } }
  function save(c){ try{ localStorage.setItem('najar-lang', c); }catch(e){} }
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  setLang(q || getSaved() || 'bn', false);
  sel.addEventListener('change', function(){ setLang(sel.value, true); save(sel.value);
    try{ var u = new URL(location.href); u.searchParams.set('lang', sel.value); history.replaceState(null,'',u); }catch(e){} });
  function goHash(){ var h=(location.hash||'').slice(1); if(!h) return; var el=document.getElementById(h); if(el){ setTimeout(function(){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},2200); },350); } }
  window.addEventListener('hashchange', goHash); goHash();
})();
</script>
