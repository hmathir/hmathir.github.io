6, 89.0003], ["Netrakona", "নেত্রকোণা", 24.871, 90.7279], ["Nilphamari", "নীলফামারী", 25.9318, 88.856], ["Noakhali", "নোয়াখালী", 22.8696, 91.0994], ["Pabna", "পাবনা", 23.9985, 89.2336], ["Panchagarh", "পঞ্চগড়", 26.3411, 88.5542], ["Patuakhali", "পটুয়াখালী", 22.3596, 90.3299], ["Pirojpur", "পিরোজপুর", 22.5781, 89.9984], ["Rajbari", "রাজবাড়ী", 23.7574, 89.6445], ["Rajshahi", "রাজশাহী", 24.3723, 88.5631], ["Rangamati", "রাঙ্গামাটি", 22.6556, 92.1754], ["Rangpur", "রংপুর", 25.7558, 89.2445], ["Satkhira", "সাতক্ষীরা", 22.7181, 89.0687], ["Shariatpur", "শরীয়তপুর", 23.206, 90.3478], ["Sherpur", "শেরপুর", 25.0205, 90.0153], ["Sirajganj", "সিরাজগঞ্জ", 24.4534, 89.7007], ["Sunamganj", "সুনামগঞ্জ", 25.0658, 91.395], ["Sylhet", "সিলেট", 24.8898, 91.8698], ["Tangail", "টাঙ্গাইল", 24.2641, 89.918], ["Thakurgaon", "ঠাকুরগাঁও", 26.0337, 88.4617]];var TASBIH_AR={"subhan": "سُبْحَانَ اللَّهِ", "hamd": "الْحَمْدُ لِلَّهِ", "akbar": "اللَّهُ أَكْبَرُ", "tahlil": "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "bihamdihi": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "istighfar": "أَسْتَغْفِرُ اللَّهَ"};</script>
<script>
(function(){
  var au = new Audio(); au.preload = 'auto';
  var st = null, TX = {};
  var DIG = {bn:'০১২৩৪৫৬৭৮৯', ar:'٠١٢٣٤٥٦٧٨٩'};
  var cur = 'bn';
  function num(n){ var d = DIG[cur]; return d ? String(n).replace(/\d/g,function(x){return d[x]}) : String(n); }
  function setBtn(pl, playing){
    var b = pl.querySelector('.play');
    b.classList.toggle('on', playing);
    b.querySelector('.ic').textContent = playing ? '❚❚' : '▶';
    b.querySelector('.tx').textContent = playing ? TX.stop : TX.play;
  }
  function clearCur(card){ card.querySelectorAll('.ay.cur').forEach(function(e){e.classList.remove('cur')}) }
  function mark(){
    clearCur(st.card);
    var e = st.card.querySelector('.ay[data-k="'+st.idx+'"]'); if(e) e.classList.add('cur');
    st.pl.querySelector('.cnt').textContent = (!st.single && st.rep > 1) ? (num(st.done+1)+' / '+num(st.rep)+' '+TX.times) : '';
  }
  function stop(){
    if(!st) return;
    au.pause(); setBtn(st.pl,false); clearCur(st.card);
    st.pl.querySelector('.prog i').style.width='0'; st.pl.querySelector('.cnt').textContent='';
    st = null;
  }
  function playIdx(){
    au.src = st.files[st.idx]; mark();
    var p = au.play();
    if(p && p.catch) p.catch(function(){ var s=st; stop(); if(s){ var c=s.pl.querySelector('.cnt'); c.textContent=TX.err; c.className='cnt err'; } });
    setBtn(st.pl,true);
  }
  function start(pl, idx, single){
    if(st) stop();
    var c = pl.querySelector('.cnt'); c.className='cnt';
    st = {pl:pl, card:pl.closest('.card'), files:JSON.parse(pl.dataset.files), idx:idx, rep:+pl.querySelector('.rep .on').dataset.r, done:0, single:!!single};
    playIdx();
  }
  au.addEventListener('ended', function(){
    if(!st) return;
    if(st.single){ stop(); return; }
    st.idx++;
    if(st.idx < st.files.length){ playIdx(); return; }
    st.done++;
    if(st.card.id) addTally(st.card.id, true);
    if(st.done < st.rep){ st.idx = 0; playIdx(); return; }
    stop();
  });
  au.addEventListener('timeupdate', function(){
    if(!st || !au.duration) return;
    var f = st.single ? au.currentTime/au.duration : (st.idx + au.currentTime/au.duration)/st.files.length;
    st.pl.querySelector('.prog i').style.width = (f*100).toFixed(1)+'%';
  });
  function bind(root){
    root.querySelectorAll('.player').forEach(function(pl){
      pl.querySelector('.play').addEventListener('click', function(){
        if(st && st.pl === pl){
          if(au.paused){ var p=au.play(); if(p&&p.catch)p.catch(function(){}); setBtn(pl,true); }
          else { au.pause(); setBtn(pl,false); }
          return;
        }
        start(pl, 0, false);
      });
      pl.querySelectorAll('.rep button').forEach(function(b){
        b.addEventListener('click', function(){
          pl.querySelectorAll('.rep button').forEach(function(x){x.classList.remove('on')});
          b.classList.add('on');
          if(st && st.pl===pl){ st.rep = +b.dataset.r; if(st.done >= st.rep) st.done = st.rep-1; mark(); }
        });
      });
      pl.closest('.card').querySelectorAll('.ay').forEach(function(a){
        a.addEventListener('click', function(){ start(pl, +a.dataset.k, true); });
      });
    });
  }
  var main = document.getElementById('main'), sel = document.getElementById('lang');
  function setLang(code, keepScroll){
    var tp = document.getElementById('L-'+code); if(!tp){ code='bn'; tp=document.getElementById('L-bn'); }
    if(st) stop();
    cur = code;
    TX = {play:tp.dataset.play, stop:tp.dataset.stop, times:tp.dataset.times, err:tp.dataset.err};
    var y = window.scrollY;
    main.innerHTML = ''; main.appendChild(tp.content.cloneNode(true));
    document.documentElement.lang = code; document.documentElement.dir = tp.dataset.dir;
    document.getElementById('langlbl').textContent = tp.dataset.label;
    sel.value = code; bind(main); bindExtras(); initTools(); showView(curView, true);
    tb.title = tp.dataset.theme; tb.setAttribute('aria-label', tp.dataset.theme);
    if(keepScroll) window.scrollTo(0, y);
  }

  /* ---- tally / today ---- */
  var KEY = (function(){ var d=new Date(); var h=d.getHours(); var p=(h>=4 && h<12)?'am':'pm'; return {p:p, k:'najar-tally-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'-'+p}; })();
  var ITEMS = KEY.p==='am' ? ['ikhlas','falaq','nas','kursi','bismillah'] : ['ikhlas','falaq','nas','kursi','bismillah','audhu'];
  var TG = {ikhlas:3,falaq:3,nas:3,kursi:1,bismillah:3,audhu:3};
  var tallies = {};
  try{ tallies = JSON.parse(localStorage.getItem(KEY.k)||'{}')||{}; }catch(e){ tallies = {}; }
  function saveT(){ try{ localStorage.setItem(KEY.k, JSON.stringify(tallies)); }catch(e){} }
  function renderTallies(){
    main.querySelectorAll('.tally').forEach(function(b){
      var id=b.dataset.id, n=Math.min(tallies[id]||0, TG[id]);
      b.querySelector('.tc').textContent = num(n);
      b.classList.toggle('done', n>=TG[id]);
      var lb=b.querySelector('.lab'); if(lb) lb.textContent = n>=TG[id] ? lb.dataset.done : lb.dataset.do;
    });
    var box = main.querySelector('.today'); if(!box) return;
    var done = ITEMS.filter(function(i){ return (tallies[i]||0)>=TG[i]; }).length;
    box.querySelector('.tt').textContent = KEY.p==='am' ? box.dataset.am : box.dataset.pm;
    box.querySelector('.tp').textContent = num(done)+'/'+num(ITEMS.length)+' '+box.dataset.done;
    box.querySelector('.tbar i').style.width = (done/ITEMS.length*100)+'%';
    box.querySelectorAll('.chip').forEach(function(c){
      var id=c.dataset.id; c.style.display = ITEMS.indexOf(id)<0 ? 'none' : '';
      c.classList.toggle('done', (tallies[id]||0)>=TG[id]);
    });
    box.querySelector('.talldone').textContent = done===ITEMS.length ? box.dataset.all : '';
    var tt=box.querySelector('.ttime b'); if(tt) tt.textContent = KEY.p==='am' ? tt.dataset.am : tt.dataset.pm;
  }
  function addTally(id, bump){
    if(!TG[id]) return;
    if((tallies[id]||0) >= TG[id]) return;
    tallies[id]=(tallies[id]||0)+1; saveT(); renderTallies();
    if(bump){ var b=main.querySelector('.tally[data-id="'+id+'"]'); if(b){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
  }
  function bindExtras(){
    main.querySelectorAll('.tally').forEach(function(b){ b.addEventListener('click', function(){ addTally(b.dataset.id, true); }); });
    var r = main.querySelector('.treset'); if(r) r.addEventListener('click', function(){ tallies={}; saveT(); renderTallies(); });
    var url = location.href.split('#')[0];
    var title = document.title;
    var wa = main.querySelector('.sh.wa'), fb = main.querySelector('.sh.fb'), cp = main.querySelector('.sh.cp');
    if(wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(title + '\n' + url);
    if(fb) fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
    if(cp) cp.addEventListener('click', function(){
      var orig = cp.textContent;
      function ok(){ cp.textContent = cp.dataset.copied; setTimeout(function(){ cp.textContent = orig; }, 1800); }
      try{ navigator.clipboard.writeText(url).then(ok, function(){ fallback(); }); }catch(e){ fallback(); }
      function fallback(){ var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
    });
    renderTallies();
  }
  var tb = document.getElementById('themebtn');
  tb.addEventListener('click', function(){ var d=document.documentElement.classList.toggle('dark'); try{ localStorage.setItem('najar-theme', d?'dark':'light'); }catch(e){} });
  /* ===== views ===== */
  var curView = 'amal';
  var HV = {prayer:'prayer', ramadan:'prayer', tasbih:'tasbih', qibla:'qibla', help:'help'};
  var LOCALE = {bn:'bn-BD', en:'en-US', ar:'ar', ur:'ur-PK', id:'id-ID', tr:'tr-TR', fr:'fr-FR', es:'es-ES', ru:'ru-RU', zh:'zh-CN'};
  function showView(v, keep){
    curView = v;
    main.querySelectorAll('.view').forEach(function(s){ s.hidden = (s.id !== 'v-'+v); });
    main.querySelectorAll('.bnav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
    if(!keep) window.scrollTo(0,0);
    if(v === 'prayer') renderPrayer();
    if(v === 'qibla') renderQibla();
    if(v === 'tasbih') renderTasbih();
  }
  function bindNav(){
    main.querySelectorAll('.bnav button').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.dataset.v;
        if(v === 'amal'){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} showView('amal'); }
        else { if(location.hash === '#'+v) showView(v); else location.hash = v; }
      });
    });
    var nb = main.querySelector('.nextbar'); if(nb) nb.addEventListener('click', function(e){ e.preventDefault(); location.hash = 'prayer'; });
  }
  function pad(n){ return (n<10?'0':'')+n; }
  function enc(s){ return encodeURIComponent(s); }

  /* ===== location + prayer ===== */
  var A = window.adhan;
  var locPref = (function(){ try{ return JSON.parse(localStorage.getItem('najar-loc')||'null') || {d:'Dhaka'}; }catch(e){ return {d:'Dhaka'}; } })();
  function saveLoc(){ try{ localStorage.setItem('najar-loc', JSON.stringify(locPref)); }catch(e){} }
  function findD(n){ for(var i=0;i<DISTRICTS.length;i++) if(DISTRICTS[i][0]===n) return DISTRICTS[i]; return null; }
  function loc(){
    if(locPref.g) return {lat:locPref.g[0], lon:locPref.g[1], name:null, tz:undefined};
    var d = findD(locPref.d) || findD('Dhaka');
    return {lat:d[2], lon:d[3], name:(cur==='bn'?d[1]:d[0]), tz:'Asia/Dhaka'};
  }
  function ptimes(date){
    if(!A) return null;
    var L = loc(), p = A.CalculationMethod.Karachi(); p.madhab = A.Madhab.Hanafi;
    return new A.PrayerTimes(new A.Coordinates(L.lat, L.lon), date, p);
  }
  function hm(d){ var L = loc(); try{ var o={hour:'2-digit',minute:'2-digit',hour12:false}; if(L.tz) o.timeZone=L.tz; var s=d.toLocaleTimeString('en-GB',o); return [(+s.slice(0,2))%24, +s.slice(3,5)]; }catch(e){ return [d.getHours(), d.getMinutes()]; } }
  function ft(d){
    if(cur==='bn'){ var x=hm(d), h=x[0], m=x[1]; var p = h<4?'রাত':h<6?'ভোর':h<11?'সকাল':h<15?'দুপুর':h<17?'বিকাল':h<19?'সন্ধ্যা':'রাত'; var h12=h%12||12; return p+' '+num(h12)+':'+num(pad(m)); }
    var L = loc(), o = {hour:'numeric', minute:'2-digit'}; if(L.tz) o.timeZone = L.tz; try{ return d.toLocaleTimeString(LOCALE[cur], o); }catch(e){ return pad(d.getHours())+':'+pad(d.getMinutes()); } }
  function fdate(d, opt){ var L = loc(); opt = opt||{}; if(L.tz) opt.timeZone = L.tz; try{ return d.toLocaleDateString(LOCALE[cur], opt); }catch(e){ return d.toDateString(); } }
  var PK = ['fajr','sunrise','dhuhr','asr','maghrib','isha'];
  function nextPrayer(){
    var now = new Date(), t = ptimes(now); if(!t) return null;
    var order = [0,2,3,4,5];
    for(var i=0;i<order.length;i++){ var k = PK[order[i]]; if(t[k] > now) return {i:order[i], at:t[k]}; }
    var tm = new Date(now.getTime()+86400000), t2 = ptimes(tm);
    return {i:0, at:t2.fajr};
  }
  function leftText(ms, box){
    var m = Math.max(0, Math.round(ms/60000)), h = Math.floor(m/60); m = m%60;
    return box.dataset.in+' '+(h? num(h)+' '+box.dataset.h+' ' : '')+num(m)+' '+box.dataset.m;
  }
  function renderNext(){
    var nb = main.querySelector('.nextbar'); if(!nb || !A) { if(nb) nb.hidden = true; return; }
    var np = nextPrayer(); if(!np) return;
    var names = JSON.parse(main.querySelector('.plist').dataset.names);
    nb.querySelector('.nb-a').textContent = '🕌 '+nb.dataset.next+': '+names[np.i]+' · '+ft(np.at);
    nb.querySelector('.nb-b').textContent = leftText(np.at - new Date(), nb);
    var pn = main.querySelector('.pnext');
    if(pn) pn.innerHTML = '<span>'+nb.dataset.next+'</span><b>'+names[np.i]+' · '+ft(np.at)+'</b><em>'+leftText(np.at - new Date(), nb)+'</em>';
    return np;
  }
  function fillDistricts(){
    var s = main.querySelector('.dsel'); if(!s) return;
    var msg = main.querySelector('.locmsg');
    var list = DISTRICTS.slice().sort(function(a,b){ return cur==='bn' ? a[1].localeCompare(b[1],'bn') : a[0].localeCompare(b[0]); });
    var h = '';
    if(locPref.g) h += '<option value="__geo" selected>📍 '+msg.dataset.mine+'</option>';
    list.forEach(function(d){ h += '<option value="'+d[0]+'"'+(!locPref.g && d[0]===locPref.d?' selected':'')+'>'+(cur==='bn'?d[1]:d[0])+'</option>'; });
    s.innerHTML = h;
  }
  function renderPrayer(){
    if(!A) return;
    var pl = main.querySelector('.plist'); if(!pl) return;
    var names = JSON.parse(pl.dataset.names), t = ptimes(new Date()), np = renderNext();
    pl.innerHTML = PK.map(function(k,i){ return '<div class="prow'+(np && np.i===i?' nx':'')+(i===1?' sr':'')+'"><span>'+names[i]+'</span><b>'+ft(t[k])+'</b></div>'; }).join('');
    main.querySelector('.s-sehri').textContent = ft(t.fajr);
    main.querySelector('.s-iftar').textContent = ft(t.maghrib);
    var tab = main.querySelector('.rtab'), wk = JSON.parse(tab.dataset.wk);
    var start = new Date(2027,1,9), today = new Date(), rows = '<tr><th>'+tab.dataset.day+'</th><th>'+tab.dataset.date+'</th><th>'+tab.dataset.sehri+'</th><th>'+tab.dataset.iftar+'</th></tr>';
    for(var i=0;i<30;i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i, 12), rt = ptimes(d);
      var isT = d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();
      rows += '<tr'+(isT?' class="rtoday"':'')+'><td>'+num(i+1)+(i===29?'*':'')+'</td><td>'+wk[d.getDay()]+', '+fdate(d,{day:'numeric',month:'short'})+'</td><td>'+ft(rt.fajr)+'</td><td>'+ft(rt.maghrib)+'</td></tr>';
    }
    tab.innerHTML = rows;
  }
  function bindPrayer(){
    fillDistricts();
    var s = main.querySelector('.dsel'), g = main.querySelector('.geo'), msg = main.querySelector('.locmsg');
    if(s) s.addEventListener('change', function(){ if(s.value==='__geo') return; locPref = {d:s.value}; saveLoc(); fillDistricts(); msg.textContent=''; renderPrayer(); renderNext(); setDefaultReminders(true); });
    if(g) g.addEventListener('click', function(){
      if(!navigator.geolocation){ msg.textContent = msg.dataset.fail; return; }
      msg.textContent = msg.dataset.ing;
      navigator.geolocation.getCurrentPosition(function(p){
        locPref = {g:[+p.coords.latitude.toFixed(4), +p.coords.longitude.toFixed(4)]}; saveLoc();
        msg.textContent = ''; fillDistricts(); renderPrayer(); renderNext(); setDefaultReminders(true);
      }, function(){ msg.textContent = msg.dataset.fail; }, {timeout:12000, maximumAge:600000});
    });
  }

  /* ===== reminders ===== */
  var REM = (function(){ try{ return JSON.parse(localStorage.getItem('najar-rem')||'null'); }catch(e){ return null; } })();
  function roundUp(d, addMin){ var x = new Date(d.getTime()+addMin*60000); var m = Math.ceil(x.getMinutes()/5)*5; x.setMinutes(m,0,0); return x; }
  function hhmmIn(d){ var L = loc(); if(L.tz){ try{ var s = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:L.tz}); return s.slice(0,5); }catch(e){} } return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function setDefaultReminders(force){
    var ins = main.querySelectorAll('.rt'); if(!ins.length) return;
    if(REM && !force){ ins.forEach(function(i){ i.value = REM[i.dataset.p]; }); }
    else if(A){ var t = ptimes(new Date()); ins.forEach(function(i){ i.value = hhmmIn(roundUp(i.dataset.p==='m'?t.fajr:t.asr, 20)); }); }
    updateRemLinks();
  }
  function remTitle(p){ var n = main.querySelector('.rnote'); return p==='m' ? n.dataset.tm : n.dataset.te; }
  function pageUrl(){ return location.href.split('#')[0]; }
  function updateRemLinks(){
    main.querySelectorAll('.rg').forEach(function(a){
      var p = a.dataset.p, v = main.querySelector('.rt[data-p="'+p+'"]').value || (p==='m'?'06:00':'16:00');
      var d = new Date(), h = +v.slice(0,2), m = +v.slice(3,5), s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m), e = new Date(s.getTime()+10*60000);
      var f = function(x){ return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00'; };
      var tz = 'Asia/Dhaka'; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; }catch(err){}
      a.href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(remTitle(p))+'&details='+enc(pageUrl())+'&dates='+f(s)+'/'+f(e)+'&ctz='+enc(tz)+'&recur='+enc('RRULE:FREQ=DAILY');
    });
  }
  function downloadIcs(){
    var now = new Date(), stamp = now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
    var ev = ['m','e'].map(function(p){
      var v = main.querySelector('.rt[data-p="'+p+'"]').value || (p==='m'?'06:00':'16:00');
      var day = now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
      return ['BEGIN:VEVENT','UID:najar-'+p+'-'+stamp+'@hmathir.github.io','DTSTAMP:'+stamp,'DTSTART:'+day+'T'+v.replace(':','')+'00','DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:'+remTitle(p),'DESCRIPTION:'+pageUrl(),'URL:'+pageUrl(),'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+remTitle(p),'END:VALARM','END:VEVENT'].join('\r\n');
    });
    var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//najar-amal//EN','CALSCALE:GREGORIAN'].concat(ev).concat(['END:VCALENDAR']).join('\r\n');
    var url = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
    var a = document.createElement('a'); a.href = url; a.download = 'najar-amal-reminder.ics'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function bindReminders(){
    main.querySelectorAll('.rt').forEach(function(i){ i.addEventListener('change', function(){
      REM = {}; main.querySelectorAll('.rt').forEach(function(x){ REM[x.dataset.p] = x.value; });
      try{ localStorage.setItem('najar-rem', JSON.stringify(REM)); }catch(e){} updateRemLinks(); }); });
    var ri = main.querySelector('.ri'); if(ri) ri.addEventListener('click', downloadIcs);
    setDefaultReminders(false);
  }

  /* ===== tasbih ===== */
  var TS = (function(){ try{ return JSON.parse(localStorage.getItem('najar-tasbih')||'null') || {set:'salah', n:0}; }catch(e){ return {set:'salah', n:0}; } })();
  var SEQ = {salah:[['subhan',33],['hamd',33],['akbar',33],['tahlil',1]], bihamdihi:[['bihamdihi',100]], istighfar:[['istighfar',100]], free:[['subhan',0]]};
  function saveTS(){ try{ localStorage.setItem('najar-tasbih', JSON.stringify(TS)); }catch(e){} }
  function seg(){ var s = SEQ[TS.set], n = TS.n; for(var i=0;i<s.length;i++){ if(!s[i][1] || n < s[i][1] || i===s.length-1) return {k:s[i][0], c:n, t:s[i][1], last:i===s.length-1}; n -= s[i][1]; } }
  function total(){ return SEQ[TS.set].reduce(function(a,b){ return a+b[1]; },0); }
  function renderTasbih(){
    var box = main.querySelector('.ttool'); if(!box) return;
    var sg = seg(), tot = total(), done = tot && TS.n >= tot, src = JSON.parse(box.dataset.src), tr = JSON.parse(box.dataset.tr||'{}');
    box.querySelectorAll('.tset').forEach(function(b){ b.classList.toggle('on', b.dataset.set===TS.set); });
    box.querySelector('.tar').textContent = TS.set==='free' ? '' : TASBIH_AR[sg.k];
    box.querySelector('.ttr').textContent = TS.set==='free' ? '' : (tr[sg.k]||'');
    box.querySelector('.tnum').textContent = num(done ? sg.t : sg.c);
    box.querySelector('.tof').textContent = sg.t ? '/ '+num(sg.t) : '';
    var frac = sg.t ? Math.min(1,(done?sg.t:sg.c)/sg.t) : (sg.c%33)/33;
    box.querySelector('.tpr').style.strokeDashoffset = (339.3*(1-frac)).toFixed(1);
    box.querySelector('.tmsg').textContent = done ? box.dataset.done : '';
    box.classList.toggle('done', !!done);
    box.querySelector('.tsrc').textContent = src[TS.set];
  }
  function bindTasbih(){
    var box = main.querySelector('.ttool'); if(!box) return;
    box.querySelectorAll('.tset').forEach(function(b){ b.addEventListener('click', function(){ TS = {set:b.dataset.set, n:0}; saveTS(); renderTasbih(); }); });
    box.querySelector('.tbig').addEventListener('click', function(){
      var tot = total(); if(tot && TS.n >= tot) return;
      var before = seg(); TS.n++; saveTS(); var after = seg();
      var vib = box.querySelector('.tvib input').checked && navigator.vibrate;
      if(vib){ try{ navigator.vibrate((tot && TS.n>=tot) || (after.k!==before.k) ? [60,40,60] : 12); }catch(e){} }
      renderTasbih();
    });
    box.querySelector('.treset2').addEventListener('click', function(){ TS.n = 0; saveTS(); renderTasbih(); });
    renderTasbih();
  }

  /* ===== qibla ===== */
  var heading = null, qListening = false, qAligned = false;
  function qBearing(){ var L = loc(); return A ? A.Qibla(new A.Coordinates(L.lat, L.lon)) : 277.7; }
  function renderQibla(){
    var box = main.querySelector('.qtool'); if(!box) return;
    var L = loc(), b = qBearing();
    box.querySelector('.qloc span').textContent = L.name || (num(L.lat.toFixed(2))+', '+num(L.lon.toFixed(2)));
    box.querySelector('.qdeg b').textContent = num(Math.round(b))+'°';
    var tk = box.querySelector('.ticks');
    if(!tk.childNodes.length){ var h=''; for(var a=0;a<360;a+=15){ var r1=a%90===0?78:84, x1=100+r1*Math.sin(a*Math.PI/180), y1=100-r1*Math.cos(a*Math.PI/180), x2=100+90*Math.sin(a*Math.PI/180), y2=100-90*Math.cos(a*Math.PI/180); h+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>'; } tk.innerHTML = h; }
    box.querySelector('.qarrow').setAttribute('transform','rotate('+b.toFixed(1)+' 100 100)');
    applyHeading();
  }
  function applyHeading(){
    var box = main.querySelector('.qtool'); if(!box || heading===null) return;
    box.querySelector('.rose').style.transform = 'rotate('+(-heading).toFixed(1)+'deg)';
    var diff = Math.abs(((qBearing() - heading + 540) % 360) - 180), ok = diff < 5;
    box.classList.toggle('aligned', ok);
    box.querySelector('.qstat').textContent = ok ? '✓ '+box.dataset.ok : '';
    if(ok && !qAligned && navigator.vibrate){ try{ navigator.vibrate(80); }catch(e){} }
    qAligned = ok;
  }
  function onOri(e){
    var h = null;
    if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
    else if(e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;
    if(h===null) return;
    var so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    heading = (h + so + 360) % 360; applyHeading();
  }
  function startCompass(){
    var box = main.querySelector('.qtool');
    function listen(){
      if(qListening) return; qListening = true;
      if('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOri);
      else window.addEventListener('deviceorientation', onOri);
      setTimeout(function(){ if(heading===null){ var b = main.querySelector('.qtool'); if(b) b.querySelector('.qstat').textContent = b.dataset.nos; } }, 3500);
    }
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(r){ if(r==='granted') listen(); else box.querySelector('.qstat').textContent = box.dataset.nos; }).catch(function(){ box.querySelector('.qstat').textContent = box.dataset.nos; });
    } else if(window.DeviceOrientationEvent) listen();
    else box.querySelector('.qstat').textContent = box.dataset.nos;
  }
  function bindQibla(){ var b = main.querySelector('.qstart'); if(b) b.addEventListener('click', startCompass); }

  /* ===== PWA install ===== */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; var i = main.querySelector('.inst'); if(i){ i.hidden = false; i.querySelector('.iosh').hidden = true; } });
  function bindInstall(){
    var i = main.querySelector('.inst'); if(!i) return;
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(standalone) { i.hidden = true; return; }
    if(deferredPrompt){ i.hidden = false; i.querySelector('.iosh').hidden = true; }
    else if(ios && /github\.io$/.test(location.hostname)){ i.hidden = false; i.querySelector('.ib').hidden = true; }
    i.querySelector('.ib').addEventListener('click', function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt = null; i.hidden = true; }); });
  }
  if('serviceWorker' in navigator && /github\.io$/.test(location.hostname)){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

  function initTools(){
    bindNav(); bindPrayer(); bindReminders(); bindTasbih(); bindQibla(); bindInstall();
    renderNext(); renderPrayer();
  }
  setInterval(function(){ if(document.hidden) return; renderNext(); if(curView==='prayer') renderPrayer(); }, 30000);

  function getSaved(){ try{ return localStorage.getItem('najar-lang'); }catch(e){ return null; } }
  function save(c){ try{ localStorage.setItem('najar-lang', c); }catch(e){} }
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  setLang(q || getSaved() || 'bn', false);
  sel.addEventListener('change', function(){ setLang(sel.value, true); save(sel.value);
    try{ var u = new URL(location.href); u.searchParams.set('lang', sel.value); history.replaceState(null,'',u); }catch(e){} });
  function goHash(){
    var h=(location.hash||'').slice(1);
    if(!h){ showView('amal', true); return; }
    if(HV[h]){ showView(HV[h]); if(h==='ramadan'){ var r=document.getElementById('ramadan'); if(r) setTimeout(function(){ r.scrollIntoView({behavior:'smooth'}); },200); } return; }
    var el=document.getElementById(h); if(!el) return;
    var v = el.closest('.view'); if(v) showView(v.id.slice(2), true);
    setTimeout(function(){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},2200); },350);
  }
  window.addEventListener('hashchange', goHash); goHash();
})();
</script>
