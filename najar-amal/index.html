<script>
(function(){
  var au = new Audio(); au.preload = 'auto';
  var st = null, TX = {};
  var DIG = {bn:'০১২৩৪৫৬৭৮৯', ar:'٠١٢٣٤٥٦٧٨٩'};
  var cur = 'bn';
  function num(n){ var d = DIG[cur]; return d ? String(n).replace(/\d/g,function(x){return d[x]}) : String(n); }
  function setBtn(pl, playing){
    var b = pl.querySelector('.play');
    b.classList.toggle('on', playing);
    b.querySelector('.ic').textContent = playing ? '❚❚' : '▶';
    b.querySelector('.tx').textContent = playing ? TX.stop : TX.play;
  }
  function clearCur(card){ card.querySelectorAll('.ay.cur').forEach(function(e){e.classList.remove('cur')}) }
  function mark(){
    clearCur(st.card);
    var e = st.card.querySelector('.ay[data-k="'+st.idx+'"]'); if(e) e.classList.add('cur');
    st.pl.querySelector('.cnt').textContent = (!st.single && st.rep > 1) ? (num(st.done+1)+' / '+num(st.rep)+' '+TX.times) : '';
  }
  function stop(){
    if(!st) return;
    au.pause(); setBtn(st.pl,false); clearCur(st.card);
    st.pl.querySelector('.prog i').style.width='0'; st.pl.querySelector('.cnt').textContent='';
    st = null;
  }
  function playIdx(){
    au.src = st.files[st.idx]; mark();
    var p = au.play();
    if(p && p.catch) p.catch(function(){ var s=st; stop(); if(s){ var c=s.pl.querySelector('.cnt'); c.textContent=TX.err; c.className='cnt err'; } });
    setBtn(st.pl,true);
  }
  function start(pl, idx, single){
    if(st) stop();
    var c = pl.querySelector('.cnt'); c.className='cnt';
    st = {pl:pl, card:pl.closest('.card'), files:JSON.parse(pl.dataset.files), idx:idx, rep:+pl.querySelector('.rep .on').dataset.r, done:0, single:!!single};
    playIdx();
  }
  au.addEventListener('ended', function(){
    if(!st) return;
    if(st.single){ stop(); return; }
    st.idx++;
    if(st.idx < st.files.length){ playIdx(); return; }
    st.done++;
    if(st.card.id) addTally(st.card.id, true);
    if(st.done < st.rep){ st.idx = 0; playIdx(); return; }
    stop();
  });
  au.addEventListener('timeupdate', function(){
    if(!st || !au.duration) return;
    var f = st.single ? au.currentTime/au.duration : (st.idx + au.currentTime/au.duration)/st.files.length;
    st.pl.querySelector('.prog i').style.width = (f*100).toFixed(1)+'%';
  });
  function bind(root){
    root.querySelectorAll('.player').forEach(function(pl){
      pl.querySelector('.play').addEventListener('click', function(){
        if(st && st.pl === pl){
          if(au.paused){ var p=au.play(); if(p&&p.catch)p.catch(function(){}); setBtn(pl,true); }
          else { au.pause(); setBtn(pl,false); }
          return;
        }
        start(pl, 0, false);
      });
      pl.querySelectorAll('.rep button').forEach(function(b){
        b.addEventListener('click', function(){
          pl.querySelectorAll('.rep button').forEach(function(x){x.classList.remove('on')});
          b.classList.add('on');
          if(st && st.pl===pl){ st.rep = +b.dataset.r; if(st.done >= st.rep) st.done = st.rep-1; mark(); }
        });
      });
      pl.closest('.card').querySelectorAll('.ay').forEach(function(a){
        a.addEventListener('click', function(){ start(pl, +a.dataset.k, true); });
      });
    });
  }
  var main = document.getElementById('main'), sel = document.getElementById('lang');
  function setLang(code, keepScroll){
    var tp = document.getElementById('L-'+code); if(!tp){ code='bn'; tp=document.getElementById('L-bn'); }
    if(st) stop();
    cur = code;
    TX = {play:tp.dataset.play, stop:tp.dataset.stop, times:tp.dataset.times, err:tp.dataset.err};
    var y = window.scrollY;
    main.innerHTML = ''; main.appendChild(tp.content.cloneNode(true));
    document.documentElement.lang = code; document.documentElement.dir = tp.dataset.dir;
    document.getElementById('langlbl').textContent = tp.dataset.label;
    sel.value = code; bind(main); bindExtras();
    tb.title = tp.dataset.theme; tb.setAttribute('aria-label', tp.dataset.theme);
    if(keepScroll) window.scrollTo(0, y);
  }

  /* ---- tally / today ---- */
  var KEY = (function(){ var d=new Date(); var h=d.getHours(); var p=(h>=4 && h<12)?'am':'pm'; return {p:p, k:'najar-tally-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'-'+p}; })();
  var ITEMS = KEY.p==='am' ? ['ikhlas','falaq','nas','kursi','bismillah'] : ['ikhlas','falaq','nas','kursi','bismillah','audhu'];
  var TG = {ikhlas:3,falaq:3,nas:3,kursi:1,bismillah:3,audhu:3};
  var tallies = {};
  try{ tallies = JSON.parse(localStorage.getItem(KEY.k)||'{}')||{}; }catch(e){ tallies = {}; }
  function saveT(){ try{ localStorage.setItem(KEY.k, JSON.stringify(tallies)); }catch(e){} }
  function renderTallies(){
    main.querySelectorAll('.tally').forEach(function(b){
      var id=b.dataset.id, n=Math.min(tallies[id]||0, TG[id]);
      b.querySelector('.tc').textContent = num(n);
      b.classList.toggle('done', n>=TG[id]);
    });
    var box = main.querySelector('.today'); if(!box) return;
    var done = ITEMS.filter(function(i){ return (tallies[i]||0)>=TG[i]; }).length;
    box.querySelector('.tt').textContent = KEY.p==='am' ? box.dataset.am : box.dataset.pm;
    box.querySelector('.tp').textContent = num(done)+'/'+num(ITEMS.length)+' '+box.dataset.done;
    box.querySelector('.tbar i').style.width = (done/ITEMS.length*100)+'%';
    box.querySelectorAll('.chip').forEach(function(c){
      var id=c.dataset.id; c.style.display = ITEMS.indexOf(id)<0 ? 'none' : '';
      c.classList.toggle('done', (tallies[id]||0)>=TG[id]);
    });
    box.querySelector('.talldone').textContent = done===ITEMS.length ? box.dataset.all : '';
  }
  function addTally(id, bump){
    if(!TG[id]) return;
    if((tallies[id]||0) >= TG[id]) return;
    tallies[id]=(tallies[id]||0)+1; saveT(); renderTallies();
    if(bump){ var b=main.querySelector('.tally[data-id="'+id+'"]'); if(b){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
  }
  function bindExtras(){
    main.querySelectorAll('.tally').forEach(function(b){ b.addEventListener('click', function(){ addTally(b.dataset.id, true); }); });
    var r = main.querySelector('.treset'); if(r) r.addEventListener('click', function(){ tallies={}; saveT(); renderTallies(); });
    var url = location.href.split('#')[0];
    var title = document.title;
    var wa = main.querySelector('.sh.wa'), fb = main.querySelector('.sh.fb'), cp = main.querySelector('.sh.cp');
    if(wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(title + '\n' + url);
    if(fb) fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
    if(cp) cp.addEventListener('click', function(){
      var orig = cp.textContent;
      function ok(){ cp.textContent = cp.dataset.copied; setTimeout(function(){ cp.textContent = orig; }, 1800); }
      try{ navigator.clipboard.writeText(url).then(ok, function(){ fallback(); }); }catch(e){ fallback(); }
      function fallback(){ var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
    });
    renderTallies();
  }
  var tb = document.getElementById('themebtn');
  tb.addEventListener('click', function(){ var d=document.documentElement.classList.toggle('dark'); try{ localStorage.setItem('najar-theme', d?'dark':'light'); }catch(e){} });
  function getSaved(){ try{ return localStorage.getItem('najar-lang'); }catch(e){ return null; } }
  function save(c){ try{ localStorage.setItem('najar-lang', c); }catch(e){} }
  var q = null; try{ q = new URLSearchParams(location.search).get('lang'); }catch(e){}
  setLang(q || getSaved() || 'bn', false);
  sel.addEventListener('change', function(){ setLang(sel.value, true); save(sel.value);
    try{ var u = new URL(location.href); u.searchParams.set('lang', sel.value); history.replaceState(null,'',u); }catch(e){} });
  function goHash(){ var h=(location.hash||'').slice(1); if(!h) return; var el=document.getElementById(h); if(el){ setTimeout(function(){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash')},2200); },350); } }
  window.addEventListener('hashchange', goHash); goHash();
})();
</script>
