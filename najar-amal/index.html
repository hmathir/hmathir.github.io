  <div class="brow"><div class="badge">Sıkıntıda</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ</p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Senden başka ilah yoktur, Sen münezzehsin; ben gerçekten zalimlerden oldum.</p></div><p class="src">Kaynak: Enbiyâ 21:87. Hiçbir Müslüman bununla bir şey için dua etmez ki Allah ona icabet etmesin. (Tirmizî 3505; Elbânî: sahih)</p></section><section class="card" id="h-karb"><div class="head"><div class="num"><span>!</span></div><h2>Büyük sıkıntı anında</h2></div>
  <div class="brow"><div class="badge">Sıkıntıda</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ</p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">La ilaha illallahul-'Azimul-Halim. La ilaha illallahu Rabbul-'Arshil-'Azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Azîm ve Halîm olan Allah’tan başka ilah yoktur. Büyük Arş’ın Rabbi Allah’tan başka ilah yoktur. Göklerin Rabbi, yerin Rabbi ve kerim Arş’ın Rabbi Allah’tan başka ilah yoktur.</p></div><p class="src">Kaynak: Sahîh-i Buhârî 6346, Sahîh-i Müslim 2730. Peygamber sıkıntı anında bunu söylerdi.</p></section><section class="card" id="h-musiba"><div class="head"><div class="num"><span>!</span></div><h2>Kayıp, ölüm veya kötü haber anında</h2></div>
  <div class="brow"><div class="badge">Musibetten sonra</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا</p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">Inna lillahi wa inna ilayhi raji'un. Allahumma'-jurni fi musibati, wa akhlif li khayran minha.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Biz Allah’a aidiz ve O’na döneceğiz. Allah’ım, musibetimde bana ecir ver ve yerine daha hayırlısını ver.</p></div><p class="src">Kaynak: Sahîh-i Müslim 918. Bunu söyleyene Allah ecir ve daha hayırlısını verir.</p></section><section class="card" id="h-pain"><div class="head"><div class="num"><span>!</span></div><h2>Bir yeriniz ağrıdığında</h2></div>
  <div class="brow"><div class="badge">Elinizi ağrıyan yere koyarak</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ <span class="x">×3</span><br>أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ <span class="x">×7</span></p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">Bismillah (3×) — A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7×).</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Allah’ın adıyla. Hissettiğim ve endişe ettiğim kötülükten Allah’a ve O’nun kudretine sığınırım.</p></div><p class="src">Kaynak: Sahîh-i Müslim 2202. Elinizi ağrıyan yere koyup 3 kez “Bismillah”, 7 kez bu duayı okuyun.</p></section><section class="card" id="h-sick"><div class="head"><div class="num"><span>!</span></div><h2>Hasta ziyaretinde</h2></div>
  <div class="brow"><div class="badge">Yanında 7 kez</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ</p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">As'alullahal-'Azim, Rabbal-'Arshil-'Azim, an yashfiyak.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Büyük Arş’ın Rabbi olan Azîm Allah’tan sana şifa vermesini dilerim.</p></div><p class="src">Kaynak: Ebû Dâvûd 3106, Tirmizî 2083; Elbânî: sahih. Eceli gelmemişse Allah ona şifa verir.</p></section><section class="card" id="h-hasbuna"><div class="head"><div class="num"><span>!</span></div><h2>Korku, tehdit veya baskı anında</h2></div>
  <div class="brow"><div class="badge">Her zaman</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ</p></div><div class="row"><span class="lbl">Okunuşu</span><p class="tr" dir="ltr">Hasbunallahu wa ni'mal-wakil.</p></div><div class="row"><span class="lbl">Anlamı</span><p class="mn">Allah bize yeter, O ne güzel vekildir.</p></div><p class="src">Kaynak: Âl-i İmrân 3:173. İbrâhim ateşe atılırken, Peygamber de düşmanla korkutulduğunda söyledi. (Sahîh-i Buhârî 4563)</p></section></section><nav class="bnav"><button type="button" data-v="amal"><span class="ni">📿</span><span class="nl">Zikirler</span></button><button type="button" data-v="prayer"><span class="ni">🕌</span><span class="nl">Namaz</span></button><button type="button" data-v="tasbih"><span class="ni">🔢</span><span class="nl">Tesbih</span></button><button type="button" data-v="qibla"><span class="ni">🧭</span><span class="nl">Kıble</span></button><button type="button" data-v="help"><span class="ni">🤲</span><span class="nl">Sıkıntı duaları</span></button></nav></template>

<div class="tip"><b>La manière de la Sunna</b><p>Avant de dormir, le Messager d’Allah <span class="saw">ﷺ</span> joignait ses mains, soufflait dedans, récitait al-Ikhlas, al-Falaq et an-Nas, puis passait ses mains sur ce qu’il pouvait de son corps, en commençant par la tête, le visage et le devant du corps. Il le faisait trois fois. <small>(Sahih al-Bukhari 5017)</small></p></div>
<section class="card" id="kursi">
  <div class="head"><div class="num"><span>2</span></div><h2>Ayat al-Kursi</h2></div>
  <div class="brow"><div class="badge">Matin · Soir · Avant de dormir</div><span class="tm">⏱ environ 40 s</span></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۚ وَهُوَ ٱلْعَلِىُّ <span class="nw">ٱلْعَظِيمُ&nbsp;<span class="am">﴿٢٥٥﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/002255.mp3"]'>
    <button class="play" type="button"><span class="ic">▶</span><span class="tx">Écouter la récitation</span></button>
    <div class="rep"><button type="button" data-r="1" class="on">1×</button><button type="button" data-r="3">3×</button></div>

  </div>

  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Allah! Point de divinité à part Lui, le Vivant, Celui qui subsiste par lui-même «Al-Qayyûm». Ni somnolence ni sommeil ne Le saisissent. A Lui appartient tout ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission? Il connaît leur passé et leur futur. Et, de Sa science, ils n'embrassent que ce qu'Il veut. Son Trône «Kursiy», déborde les cieux et la terre, dont la garde ne Lui coûte aucune peine. Et Il est le Très Haut, le Très Grand</p></div><button class="tally" type="button" data-id="kursi" data-target="1"><span class="tick">✓</span><span class="lab" data-do="Touchez ici après chaque lecture" data-done="Terminé">Touchez ici après chaque lecture</span><span class="cn"><span class="tc">0</span>/1</span></button><p class="src">Source: Sourate al-Baqara 2:255. Celui qui le récite avant de dormir a un gardien de la part d’Allah jusqu’au matin, et Satan ne l’approche pas (Sahih al-Bukhari 5010). Récitation matin & soir : al-Mustadrak d’al-Hakim, jugé authentique par al-Albani (Sahih at-Targhib).</p>
</section>

<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Pour que rien ne puisse nuire</h2></div>
  <div class="brow"><div class="badge">Matin 3× · Soir 3×</div><span class="tm">⏱ environ 20 s</span></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Au nom d’Allah, avec le nom duquel rien sur terre ni dans le ciel ne peut nuire, et Il est Celui qui entend tout, l’Omniscient.</p></div><button class="tally" type="button" data-id="bismillah" data-target="3"><span class="tick">✓</span><span class="lab" data-do="Touchez ici après chaque lecture" data-done="Terminé">Touchez ici après chaque lecture</span><span class="cn"><span class="tc">0</span>/3</span></button><p class="src">Source: Abu Dawud 5088, at-Tirmidhi 3388 ; authentique selon al-Albani. Mérite : qui la dit trois fois le matin ne sera pas frappé par un malheur soudain jusqu’au soir, et trois fois le soir, jusqu’au matin.</p>
</section>
<section class="card" id="audhu">
  <div class="head"><div class="num"><span>4</span></div><h2>Refuge contre le mal de la création</h2></div>
  <div class="brow"><div class="badge">Soir 3×</div><span class="tm">⏱ environ 10 s</span></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammati min sharri ma khalaq.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je cherche refuge auprès des paroles parfaites d’Allah contre le mal de ce qu’Il a créé.</p></div><button class="tally" type="button" data-id="audhu" data-target="3"><span class="tick">✓</span><span class="lab" data-do="Touchez ici après chaque lecture" data-done="Terminé">Touchez ici après chaque lecture</span><span class="cn"><span class="tc">0</span>/3</span></button><p class="src">Source: Sahih Muslim 2709 ; trois fois : at-Tirmidhi 3604.</p>
</section>
<p class="intro" id="family">Le Messager d’Allah <span class="saw">ﷺ</span> plaçait al-Hasan et al-Husayn sous la protection d’Allah avec cette invocation, et disait que leur ancêtre Ibrahim protégeait ainsi Isma‘il et Ishaq. <small>(Sahih al-Bukhari 3371)</small></p>
<section class="card" id="family-self">
  <div class="head"><div class="num"><span>5</span></div><h2>Pour soi-même</h2></div>
  <div class="brow"><div class="badge">À tout moment</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je cherche refuge auprès des paroles parfaites d’Allah contre tout diable, toute bête venimeuse et tout mauvais œil nuisible.</p></div><p class="src">Source: Sahih al-Bukhari 3371</p>
</section>
<section class="card" id="family-kids">
  <div class="head"><div class="num"><span>5</span></div><h2>Pour ses enfants & sa famille</h2></div>
  <div class="brow"><div class="badge">À réciter sur eux</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je vous place tous deux sous la protection des paroles parfaites d’Allah contre tout diable, toute bête venimeuse et tout mauvais œil nuisible.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>pour un garçon</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>pour une fille</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>pour deux (texte du hadith)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>pour trois ou plus</small></div></div><p class="src">Source: at-Tirmidhi 2060 (authentique selon al-Albani) ; récit d’origine : Sahih al-Bukhari 3371</p>
</section>
<p class="intro" id="barakah">Le Messager d’Allah <span class="saw">ﷺ</span> a dit : lorsque l’un de vous voit en lui-même, dans ses biens ou chez son frère quelque chose qui lui plaît, qu’il invoque la bénédiction pour cela, car le mauvais œil est une réalité. <small>(Musnad Ahmad, Ibn Majah, Muwatta Malik ; authentique selon al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Quand un bienfait (le vôtre ou celui d’autrui) vous plaît</h2></div>
  <div class="badge">Sur le moment</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Telle est la volonté d’Allah ; il n’y a de puissance que par Allah.</p><p class="src c">Sourate al-Kahf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Ô Allah, bénis-le.</p><p class="src c">Pour autrui : <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="sechead" id="rizq"><h2>Invocations pour la subsistance & le travail</h2><p>Pour les freelances et tous ceux qui travaillent en ligne</p></div>
<p class="intro">Le Messager d’Allah <span class="saw">ﷺ</span> a dit : « Si vous placiez votre confiance en Allah comme il se doit, Il vous accorderait votre subsistance comme Il l’accorde aux oiseaux : ils partent le matin le ventre vide et reviennent le soir rassasiés. » <small>(at-Tirmidhi 2344, Ibn Majah 4164 ; at-Tirmidhi : hasan sahih)</small></p>
<section class="card" id="fajr">
  <div class="head"><div class="num"><span>7</span></div><h2>Science utile & subsistance licite</h2></div>
  <div class="brow"><div class="badge">Après le salam de Fajr</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbalan.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Ô Allah, je Te demande une science utile, une subsistance bonne et des œuvres acceptées.</p></div><p class="src">Source: Ibn Majah 925 ; authentique selon al-Albani. Le Prophète la disait après le salam de la prière de l’aube.</p>
</section>
<section class="card" id="sharh">
  <div class="head"><div class="num"><span>7</span></div><h2>Avant un appel client, une réunion ou une présentation</h2></div>
  <div class="brow"><div class="badge">Avant de commencer</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">قَالَ رَبِّ ٱشْرَحْ لِى <span class="nw">صَدْرِى&nbsp;<span class="am">﴿٢٥﴾</span></span></span> <span class="ay" data-k="1">وَيَسِّرْ لِىٓ <span class="nw">أَمْرِى&nbsp;<span class="am">﴿٢٦﴾</span></span></span> <span class="ay" data-k="2">وَٱحْلُلْ عُقْدَةًۭ مِّن <span class="nw">لِّسَانِى&nbsp;<span class="am">﴿٢٧﴾</span></span></span> <span class="ay" data-k="3">يَفْقَهُوا۟ <span class="nw">قَوْلِى&nbsp;<span class="am">﴿٢٨﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/020025.mp3", "audio/020026.mp3", "audio/020027.mp3", "audio/020028.mp3"]'>

    <div class="prog"><i></i></div><div class="cnt"></div>
  </div>
  <p class="hint">Touchez un verset pour n’écouter que celui-ci</p>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Qala Rabbish-rah li sadri. Wa yassir li amri. Wahlul 'uqdatam-min lisani. Yafqahu qawli.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">[Moïse] dit: «Seigneur, ouvre-moi ma poitrine et facilite ma mission et dénoue un nœud en ma langue afin qu'ils comprennent mes paroles</p></div><p class="src">Source: Sourate Ta-Ha 20:25–28. En invocation, commencez à « Rabbi-shrah ».</p>
</section>
<section class="card" id="hamm">
  <div class="head"><div class="num"><span>7</span></div><h2>Contre le souci, la paresse & les dettes</h2></div>
  <div class="brow"><div class="badge">À tout moment</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-jubni wal-bukhl, wa dala'id-dayni wa ghalabatir-rijal.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Ô Allah, je cherche refuge auprès de Toi contre le souci et la tristesse, l’incapacité et la paresse, la lâcheté et l’avarice, le poids des dettes et la domination des hommes.</p></div><p class="src">Source: Sahih al-Bukhari 6369. Le Prophète la disait souvent.</p>
</section>
<section class="card" id="kifaya">
  <div class="head"><div class="num"><span>7</span></div><h2>Se suffire du licite</h2></div>
  <div class="brow"><div class="badge">À tout moment</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ</p></div>
  <div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Allahummak-fini bi halalika 'an haramik, wa aghnini bi fadlika 'amman siwak.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Ô Allah, suffis-moi par ce que Tu as rendu licite afin que je me passe de l’illicite, et par Ta grâce rends-moi indépendant de tout autre que Toi.</p></div><p class="src">Source: at-Tirmidhi 3563 ; at-Tirmidhi : hasan. ‘Ali a dit : même avec une dette grande comme une montagne, Allah la réglerait pour toi.</p>
</section>
<div class="tip green"><b>Rappel quotidien</b><p>Le mauvais œil est réel, mais la protection d’Allah est plus grande. Ne vivez pas dans la peur : soyez assidu aux invocations, remerciez Allah pour Ses bienfaits, et quand vous voyez du bien chez autrui, invoquez la bénédiction au lieu d’envier. Le bien et le mal ne sont qu’entre les mains d’Allah.</p></div>

  <div class="brow"><div class="badge">Dans l’épreuve</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ</p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Pas de divinité à part Toi ! Gloire à Toi ! J’ai été vraiment du nombre des injustes.</p></div><p class="src">Source: Sourate al-Anbiya 21:87. Aucun musulman n’invoque par elle pour quoi que ce soit sans qu’Allah ne lui réponde. (at-Tirmidhi 3505 ; authentique selon al-Albani)</p></section><section class="card" id="h-karb"><div class="head"><div class="num"><span>!</span></div><h2>Dans une grande angoisse</h2></div>
  <div class="brow"><div class="badge">Dans l’angoisse</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ</p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">La ilaha illallahul-'Azimul-Halim. La ilaha illallahu Rabbul-'Arshil-'Azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Pas de divinité sauf Allah, l’Immense, le Longanime. Pas de divinité sauf Allah, Seigneur du Trône immense. Pas de divinité sauf Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du noble Trône.</p></div><p class="src">Source: Sahih al-Bukhari 6346, Sahih Muslim 2730. Le Prophète la disait dans l’angoisse.</p></section><section class="card" id="h-musiba"><div class="head"><div class="num"><span>!</span></div><h2>Lors d’une perte, d’un décès ou d’une mauvaise nouvelle</h2></div>
  <div class="brow"><div class="badge">Après une perte</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا</p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Inna lillahi wa inna ilayhi raji'un. Allahumma'-jurni fi musibati, wa akhlif li khayran minha.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Nous sommes à Allah et c’est vers Lui que nous retournerons. Ô Allah, récompense-moi dans mon malheur et remplace-le par meilleur.</p></div><p class="src">Source: Sahih Muslim 918. Allah récompense celui qui la dit et lui donne mieux.</p></section><section class="card" id="h-pain"><div class="head"><div class="num"><span>!</span></div><h2>En cas de douleur</h2></div>
  <div class="brow"><div class="badge">Main sur l’endroit douloureux</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ <span class="x">×3</span><br>أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ <span class="x">×7</span></p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Bismillah (3×) — A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7×).</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Au nom d’Allah. Je cherche refuge auprès d’Allah et de Sa puissance contre le mal que je ressens et que je crains.</p></div><p class="src">Source: Sahih Muslim 2202. Posez la main sur l’endroit douloureux, dites « Bismillah » 3 fois et cette invocation 7 fois.</p></section><section class="card" id="h-sick"><div class="head"><div class="num"><span>!</span></div><h2>En visitant un malade</h2></div>
  <div class="brow"><div class="badge">7 fois auprès de lui</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ</p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">As'alullahal-'Azim, Rabbal-'Arshil-'Azim, an yashfiyak.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Je demande à Allah l’Immense, Seigneur du Trône immense, de te guérir.</p></div><p class="src">Source: Abu Dawud 3106, at-Tirmidhi 2083 ; authentique selon al-Albani. Si son terme n’est pas venu, Allah le guérit.</p></section><section class="card" id="h-hasbuna"><div class="head"><div class="num"><span>!</span></div><h2>Face à la peur, aux menaces ou à la pression</h2></div>
  <div class="brow"><div class="badge">À tout moment</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ</p></div><div class="row"><span class="lbl">Translittération</span><p class="tr" dir="ltr">Hasbunallahu wa ni'mal-wakil.</p></div><div class="row"><span class="lbl">Sens</span><p class="mn">Allah nous suffit ; Il est notre meilleur garant.</p></div><p class="src">Source: Sourate Al Imran 3:173. Ibrahim la dit en étant jeté au feu, et le Prophète face aux menaces de l’ennemi. (Sahih al-Bukhari 4563)</p></section></section><nav class="bnav"><button type="button" data-v="amal"><span class="ni">📿</span><span class="nl">Adhkar</span></button><button type="button" data-v="prayer"><span class="ni">🕌</span><span class="nl">Prière</span></button><button type="button" data-v="tasbih"><span class="ni">🔢</span><span class="nl">Tasbih</span></button><button type="button" data-v="qibla"><span class="ni">🧭</span><span class="nl">Qibla</span></button><button type="button" data-v="help"><span class="ni">🤲</span><span class="nl">Détresse</span></button></nav></template>

<p class="intro">El Mensajero de Alá <span class="saw">ﷺ</span> dijo: «Recita <b>Qul huwa Allahu ahad</b> y las <b>Mu‘awwidhatayn</b> (al-Falaq y an-Nas) tres veces por la tarde y por la mañana; te bastarán contra todo.» <small>(Abu Dawud 5082, at-Tirmidhi 3575; hasan según al-Albani)</small></p>

<div class="tip"><b>La forma de la Sunna</b><p>Antes de dormir, el Mensajero de Alá <span class="saw">ﷺ</span> juntaba las manos, soplaba en ellas, recitaba al-Ijlas, al-Falaq y an-Nas, y luego pasaba las manos por todo el cuerpo que podía, empezando por la cabeza, la cara y la parte delantera del cuerpo. Lo hacía tres veces. <small>(Sahih al-Bujari 5017)</small></p></div>
<section class="card" id="kursi">
  <div class="head"><div class="num"><span>2</span></div><h2>Ayat al-Kursi</h2></div>
  <div class="brow"><div class="badge">Mañana · Tarde · Antes de dormir</div><span class="tm">⏱ unos 40 s</span></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۚ وَهُوَ ٱلْعَلِىُّ <span class="nw">ٱلْعَظِيمُ&nbsp;<span class="am">﴿٢٥٥﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/002255.mp3"]'>

  </div>
  <p class="hint">Toca cualquier aleya para escuchar solo esa aleya</p>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">¡Dios! No existe nada ni nadie con derecho a ser adorado excepto Él, el Viviente [Eterno], el Sustentador [y Gobernador de toda la creación]. No Lo afectan somnolencia ni sueño. Suyo es cuanto hay en los cielos y la Tierra. ¿Quién podrá interceder ante Él si no es con Su permiso? Conoce el pasado y el futuro [lo manifiesto y lo oculto] y nadie abarca de Su conocimiento salvo lo que Él quiere. El escabel de Su Trono abarca los cielos y la Tierra, y la custodia [y mantenimiento] de ambos no Lo agobia. Y Él es el Sublime, el Grandioso</p></div><button class="tally" type="button" data-id="kursi" data-target="1"><span class="tick">✓</span><span class="lab" data-do="Toca aquí al terminar cada lectura" data-done="Completado">Toca aquí al terminar cada lectura</span><span class="cn"><span class="tc">0</span>/1</span></button><p class="src">Fuente: Sura al-Baqara 2:255. Quien la recita antes de dormir tiene un guardián de parte de Alá hasta la mañana y Satanás no se le acerca (Sahih al-Bujari 5010). Recitación de mañana y tarde: al-Mustadrak de al-Hakim, auténtico según al-Albani (Sahih at-Targhib).</p>

<section class="card" id="bismillah">
  <div class="head"><div class="num"><span>3</span></div><h2>Para que nada pueda dañarte</h2></div>
  <div class="brow"><div class="badge">Mañana 3× · Tarde 3×</div><span class="tm">⏱ unos 20 s</span></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">En el nombre de Alá, con cuyo nombre nada en la tierra ni en el cielo puede causar daño, y Él es el que todo lo oye, el que todo lo sabe.</p></div><button class="tally" type="button" data-id="bismillah" data-target="3"><span class="tick">✓</span><span class="lab" data-do="Toca aquí al terminar cada lectura" data-done="Completado">Toca aquí al terminar cada lectura</span><span class="cn"><span class="tc">0</span>/3</span></button><p class="src">Fuente: Abu Dawud 5088, at-Tirmidhi 3388; auténtico según al-Albani. Virtud: quien la dice tres veces por la mañana no sufrirá una desgracia repentina hasta la tarde, y tres veces por la tarde, hasta la mañana.</p>
</section>

</section>
<p class="intro" id="family">El Mensajero de Alá <span class="saw">ﷺ</span> ponía a al-Hasan y al-Husayn bajo la protección de Alá con esta súplica, y decía que su antepasado Ibrahim protegía así a Ismael e Isaac. <small>(Sahih al-Bujari 3371)</small></p>

  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">A'udhu bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Me refugio en las palabras perfectas de Alá de todo demonio, de toda criatura venenosa y de todo mal de ojo dañino.</p></div><p class="src">Fuente: Sahih al-Bujari 3371</p>

  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Os pongo a ambos bajo la protección de las palabras perfectas de Alá de todo demonio, de toda criatura venenosa y de todo mal de ojo dañino.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>para un niño</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>para una niña</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>para dos (texto del hadiz)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>para tres o más</small></div></div><p class="src">Fuente: at-Tirmidhi 2060 (auténtico según al-Albani); relato original en Sahih al-Bujari 3371</p>

<p class="intro" id="barakah">El Mensajero de Alá <span class="saw">ﷺ</span> dijo: cuando alguno de vosotros vea en sí mismo, en sus bienes o en su hermano algo que le agrade, que pida bendición para ello, pues el mal de ojo es real. <small>(Musnad Ahmad, Ibn Mayah, Muwatta Malik; auténtico según al-Albani)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Cuando admiras una bendición tuya o ajena</h2></div>
  <div class="badge">En el momento</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Lo que Alá quiere [sucede]; no hay poder sino en Alá.</p><p class="src c">Sura al-Kahf 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">Oh Alá, bendícelo.</p><p class="src c">Para otra persona: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="sechead" id="rizq"><h2>Súplicas por el sustento y el trabajo</h2><p>Para freelancers y todos los que trabajan en línea</p></div>
<p class="intro">El Mensajero de Alá <span class="saw">ﷺ</span> dijo: «Si confiarais en Alá como Él merece, os daría el sustento como se lo da a los pájaros: salen por la mañana con el estómago vacío y regresan por la tarde saciados.» <small>(at-Tirmidhi 2344, Ibn Mayah 4164; at-Tirmidhi: hasan sahih)</small></p>
<section class="card" id="fajr">
  <div class="head"><div class="num"><span>7</span></div><h2>Conocimiento útil y sustento lícito</h2></div>
  <div class="brow"><div class="badge">Tras el salam de Fajr</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbalan.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Oh Alá, Te pido conocimiento útil, sustento bueno y obras aceptadas.</p></div><p class="src">Fuente: Ibn Mayah 925; auténtico según al-Albani. El Profeta la decía tras el salam de la oración del alba.</p>
</section>
<section class="card" id="sharh">
  <div class="head"><div class="num"><span>7</span></div><h2>Antes de una llamada con un cliente, reunión o presentación</h2></div>
  <div class="brow"><div class="badge">Antes de empezar</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">قَالَ رَبِّ ٱشْرَحْ لِى <span class="nw">صَدْرِى&nbsp;<span class="am">﴿٢٥﴾</span></span></span> <span class="ay" data-k="1">وَيَسِّرْ لِىٓ <span class="nw">أَمْرِى&nbsp;<span class="am">﴿٢٦﴾</span></span></span> <span class="ay" data-k="2">وَٱحْلُلْ عُقْدَةًۭ مِّن <span class="nw">لِّسَانِى&nbsp;<span class="am">﴿٢٧﴾</span></span></span> <span class="ay" data-k="3">يَفْقَهُوا۟ <span class="nw">قَوْلِى&nbsp;<span class="am">﴿٢٨﴾</span></span></span></p></div>
  <div class="player" data-files='["audio/020025.mp3", "audio/020026.mp3", "audio/020027.mp3", "audio/020028.mp3"]'>
    <button class="play" type="button"><span class="ic">▶</span><span class="tx">Escuchar la recitación</span></button>
    <div class="rep"><button type="button" data-r="1" class="on">1×</button><button type="button" data-r="3">3×</button></div>
    <div class="prog"><i></i></div><div class="cnt"></div>
  </div>
  <p class="hint">Toca cualquier aleya para escuchar solo esa aleya</p>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Qala Rabbish-rah li sadri. Wa yassir li amri. Wahlul 'uqdatam-min lisani. Yafqahu qawli.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Dijo [Moisés]: "¡Oh, Señor mío! Abre mi corazón [y dame valor] facilita mi misión suelta el nudo que hay en mi lengua para que comprendan mis palabras</p></div><p class="src">Fuente: Sura Ta-Ha 20:25–28. Como súplica, empieza desde «Rabbi-shrah».</p>
</section>
<section class="card" id="hamm">
  <div class="head"><div class="num"><span>7</span></div><h2>Contra la preocupación, la pereza y las deudas</h2></div>
  <div class="brow"><div class="badge">En cualquier momento</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-jubni wal-bukhl, wa dala'id-dayni wa ghalabatir-rijal.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Oh Alá, me refugio en Ti de la preocupación y la tristeza, de la incapacidad y la pereza, de la cobardía y la avaricia, del peso de las deudas y de la opresión de los hombres.</p></div><p class="src">Fuente: Sahih al-Bujari 6369. El Profeta la decía con frecuencia.</p>
</section>
<section class="card" id="kifaya">
  <div class="head"><div class="num"><span>7</span></div><h2>Bastarse con lo lícito</h2></div>
  <div class="brow"><div class="badge">En cualquier momento</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ</p></div>
  <div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Allahummak-fini bi halalika 'an haramik, wa aghnini bi fadlika 'amman siwak.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Oh Alá, bástame con lo que has hecho lícito para no necesitar lo ilícito, y por Tu favor hazme independiente de todo excepto de Ti.</p></div><p class="src">Fuente: at-Tirmidhi 3563; at-Tirmidhi: hasan. ‘Ali dijo: aunque tuvieras una deuda del tamaño de una montaña, Alá la saldaría por ti.</p>
</section>
<div class="tip green"><b>Recordatorio diario</b><p>El mal de ojo es real, pero la protección de Alá es mayor. No vivas con miedo: sé constante con las súplicas, agradece tus bendiciones y, cuando veas algo bueno en otros, pide bendición en lugar de envidiar. El bien y el mal están solo en manos de Alá.</p></div>

  <div class="brow"><div class="badge">En la dificultad</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ</p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">No hay otra divinidad más que Tú. ¡Glorificado seas! En verdad he sido de los injustos.</p></div><p class="src">Fuente: Sura al-Anbiya 21:87. Ningún musulmán suplica con ella por algo sin que Alá le responda. (at-Tirmidhi 3505; auténtico según al-Albani)</p></section><section class="card" id="h-karb"><div class="head"><div class="num"><span>!</span></div><h2>En una gran angustia</h2></div>
  <div class="brow"><div class="badge">En la angustia</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ</p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">La ilaha illallahul-'Azimul-Halim. La ilaha illallahu Rabbul-'Arshil-'Azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">No hay divinidad salvo Alá, el Grandioso, el Indulgente. No hay divinidad salvo Alá, Señor del Trono grandioso. No hay divinidad salvo Alá, Señor de los cielos, Señor de la tierra y Señor del noble Trono.</p></div><p class="src">Fuente: Sahih al-Bujari 6346, Sahih Muslim 2730. El Profeta la decía en la angustia.</p></section><section class="card" id="h-musiba"><div class="head"><div class="num"><span>!</span></div><h2>Ante una pérdida, una muerte o una mala noticia</h2></div>
  <div class="brow"><div class="badge">Tras una pérdida</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا</p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Inna lillahi wa inna ilayhi raji'un. Allahumma'-jurni fi musibati, wa akhlif li khayran minha.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">De Alá somos y a Él retornaremos. Oh Alá, recompénsame en mi desgracia y dame algo mejor a cambio.</p></div><p class="src">Fuente: Sahih Muslim 918. Alá recompensa a quien la dice y le da algo mejor.</p></section><section class="card" id="h-pain"><div class="head"><div class="num"><span>!</span></div><h2>Cuando sientes dolor</h2></div>
  <div class="brow"><div class="badge">Mano sobre el lugar del dolor</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ <span class="x">×3</span><br>أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ <span class="x">×7</span></p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Bismillah (3×) — A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7×).</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">En el nombre de Alá. Me refugio en Alá y en Su poder del mal que siento y que temo.</p></div><p class="src">Fuente: Sahih Muslim 2202. Pon la mano sobre el lugar del dolor, di «Bismillah» 3 veces y esta súplica 7 veces.</p></section><section class="card" id="h-sick"><div class="head"><div class="num"><span>!</span></div><h2>Al visitar a un enfermo</h2></div>
  <div class="brow"><div class="badge">7 veces a su lado</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ</p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">As'alullahal-'Azim, Rabbal-'Arshil-'Azim, an yashfiyak.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Pido a Alá el Grandioso, Señor del Trono grandioso, que te cure.</p></div><p class="src">Fuente: Abu Dawud 3106, at-Tirmidhi 2083; auténtico según al-Albani. Si no ha llegado su hora, Alá lo cura.</p></section><section class="card" id="h-hasbuna"><div class="head"><div class="num"><span>!</span></div><h2>Ante el miedo, amenazas o presión</h2></div>
  <div class="brow"><div class="badge">En cualquier momento</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ</p></div><div class="row"><span class="lbl">Transliteración</span><p class="tr" dir="ltr">Hasbunallahu wa ni'mal-wakil.</p></div><div class="row"><span class="lbl">Significado</span><p class="mn">Alá nos basta, y Él es el mejor protector.</p></div><p class="src">Fuente: Sura Al Imran 3:173. Lo dijo Ibrahim al ser arrojado al fuego y el Profeta al ser amenazado por el enemigo. (Sahih al-Bujari 4563)</p></section></section><nav class="bnav"><button type="button" data-v="amal"><span class="ni">📿</span><span class="nl">Adhkar</span></button><button type="button" data-v="prayer"><span class="ni">🕌</span><span class="nl">Oración</span></button><button type="button" data-v="tasbih"><span class="ni">🔢</span><span class="nl">Tasbih</span></button><button type="button" data-v="qibla"><span class="ni">🧭</span><span class="nl">Alquibla</span></button><button type="button" data-v="help"><span class="ni">🤲</span><span class="nl">Dificultades</span></button></nav></template>

<div class="tip"><b>Как делал Пророк</b><p>Перед сном Посланник Аллаха <span class="saw">ﷺ</span> складывал ладони, дул в них, читал суры аль-Ихлас, аль-Фалак и ан-Нас, а затем обтирал ими своё тело, сколько мог, начиная с головы, лица и передней части тела. Он делал это три раза. <small>(Сахих аль-Бухари 5017)</small></p></div>

  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ</p></div>
  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">U'idhukuma bi kalimatil-lahit-tammah, min kulli shaytanin wa hammah, wa min kulli 'aynin lammah.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Вверяю вас обоих защите совершенных слов Аллаха от всякого шайтана, всякой ядовитой твари и от всякого дурного глаза.</p></div><div class="forms"><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكَ</span><b dir="ltr">U'idhuka</b><small>для одного мальчика</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكِ</span><b dir="ltr">U'idhuki</b><small>для одной девочки</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمَا</span><b dir="ltr">U'idhukuma</b><small>для двоих (текст хадиса)</small></div><div><span dir="rtl" lang="ar" class="arf">أُعِيذُكُمْ</span><b dir="ltr">U'idhukum</b><small>для троих и более</small></div></div><p class="src">Источник: ат-Тирмизи 2060 (аль-Албани: достоверно); исходный рассказ — Сахих аль-Бухари 3371</p>
</section>
<p class="intro" id="barakah">Посланник Аллаха <span class="saw">ﷺ</span> сказал: если кто-то из вас увидит в себе, в своём имуществе или в своём брате то, что ему понравится, пусть попросит для этого благодати, ведь сглаз — истина. <small>(Муснад Ахмада, Ибн Маджа, Муватта Малика; аль-Албани: достоверно)</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>Когда восхищаешься своим или чужим благом</h2></div>
  <div class="badge">Сразу</div>
  <div class="duo"><div class="mini"><p class="ar quran" dir="rtl" lang="ar">مَا شَآءَ ٱللَّهُ لَا قُوَّةَ إِلَّا بِٱللَّهِ</p><p class="tr c" dir="ltr">Ma sha' Allah, la quwwata illa billah</p><p class="mn c">Так пожелал Аллах! Нет силы ни у кого, кроме Аллаха.</p><p class="src c">Сура аль-Кахф 18:39</p></div><div class="mini"><p class="ar hadith" dir="rtl" lang="ar">اللَّهُمَّ بَارِكْ فِيهِ</p><p class="tr c" dir="ltr">Allahumma barik fihi</p><p class="mn c">О Аллах, благослови это.</p><p class="src c">Для другого: <span dir="rtl" lang="ar" class="arf">بَارَكَ اللَّهُ لَكَ</span> “Barakallahu laka”</p></div></div></section>
<div class="sechead" id="rizq"><h2>Мольбы о пропитании и работе</h2><p>Для фрилансеров и всех, кто работает онлайн</p></div>
<p class="intro">Посланник Аллаха <span class="saw">ﷺ</span> сказал: «Если бы вы уповали на Аллаха должным образом, Он наделял бы вас пропитанием так же, как наделяет птиц: утром они улетают голодными, а вечером возвращаются сытыми». <small>(ат-Тирмизи 2344, Ибн Маджа 4164; ат-Тирмизи: хасан сахих)</small></p>
<section class="card" id="fajr">
  <div class="head"><div class="num"><span>7</span></div><h2>О полезном знании и благом уделе</h2></div>
  <div class="brow"><div class="badge">После салама утренней молитвы</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا</p></div>
  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Allahumma inni as'aluka 'ilman nafi'an, wa rizqan tayyiban, wa 'amalan mutaqabbalan.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">О Аллах, прошу у Тебя полезного знания, благого удела и принятых деяний.</p></div><p class="src">Источник: Ибн Маджа 925; аль-Албани: достоверно. Пророк говорил это после салама утренней молитвы.</p>
</section>
<section class="card" id="sharh">
  <div class="head"><div class="num"><span>7</span></div><h2>Перед звонком клиенту, встречей или презентацией</h2></div>
  <div class="brow"><div class="badge">Перед началом</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran"><span class="ay" data-k="0">قَالَ رَبِّ ٱشْرَحْ لِى <span class="nw">صَدْرِى&nbsp;<span class="am">﴿٢٥﴾</span></span></span> <span class="ay" data-k="1">وَيَسِّرْ لِىٓ <span class="nw">أَمْرِى&nbsp;<span class="am">﴿٢٦﴾</span></span></span> <span class="ay" data-k="2">وَٱحْلُلْ عُقْدَةًۭ مِّن <span class="nw">لِّسَانِى&nbsp;<span class="am">﴿٢٧﴾</span></span></span> <span class="ay" data-k="3">يَفْقَهُوا۟ <span class="nw">قَوْلِى&nbsp;<span class="am">﴿٢٨﴾</span></span></span></p></div>

<section class="card" id="hamm">
  <div class="head"><div class="num"><span>7</span></div><h2>От тревоги, лени и долгов</h2></div>
  <div class="brow"><div class="badge">В любое время</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ</p></div>
  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-'ajzi wal-kasal, wal-jubni wal-bukhl, wa dala'id-dayni wa ghalabatir-rijal.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">О Аллах, прибегаю к Тебе от тревоги и печали, от бессилия и лени, от трусости и скупости, от бремени долга и от притеснения людей.</p></div><p class="src">Источник: Сахих аль-Бухари 6369. Пророк часто произносил эту мольбу.</p>
</section>
<section class="card" id="kifaya">
  <div class="head"><div class="num"><span>7</span></div><h2>О достатке через дозволенное</h2></div>
  <div class="brow"><div class="badge">В любое время</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ</p></div>
  <div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Allahummak-fini bi halalika 'an haramik, wa aghnini bi fadlika 'amman siwak.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">О Аллах, удовлетвори меня дозволенным Тобой, чтобы обойтись без запретного, и по милости Своей избавь меня от нужды во всех, кроме Тебя.</p></div><p class="src">Источник: ат-Тирмизи 3563; ат-Тирмизи: хасан. Али сказал: даже если на тебе долг величиной с гору, Аллах погасит его.</p>
</section>
<div class="tip green"><b>Ежедневное напоминание</b><p>Сглаз — истина, но защита Аллаха сильнее. Не живите в страхе: постоянно читайте азкары, благодарите за блага, а увидев добро у других, просите для них благодати, а не завидуйте. Польза и вред — только в руках Аллаха.</p></div>

</section></section><section class="view" id="v-help" hidden><div class="sechead"><h2>Мольбы в трудную минуту</h2><p>При тревоге, беде, болезни или страхе</p></div><section class="card" id="h-yunus"><div class="head"><div class="num"><span>!</span></div><h2>В любой беде (мольба Юнуса)</h2></div>
  <div class="brow"><div class="badge">В беде</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ</p></div><div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Нет божества, кроме Тебя! Пречист Ты! Воистину, я был одним из беззаконников!</p></div><p class="src">Источник: Сура аль-Анбия 21:87. Ни один мусульманин не обратится с ней по какому-либо делу, без того чтобы Аллах не ответил ему. (ат-Тирмизи 3505; аль-Албани: достоверно)</p></section><section class="card" id="h-karb"><div class="head"><div class="num"><span>!</span></div><h2>В сильной печали</h2></div>
  <div class="brow"><div class="badge">В печали</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ</p></div><div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">La ilaha illallahul-'Azimul-Halim. La ilaha illallahu Rabbul-'Arshil-'Azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Нет божества, кроме Аллаха, Великого, Кроткого. Нет божества, кроме Аллаха, Господа великого Трона. Нет божества, кроме Аллаха, Господа небес, Господа земли и Господа благородного Трона.</p></div><p class="src">Источник: Сахих аль-Бухари 6346, Сахих Муслим 2730. Пророк говорил это в печали.</p></section><section class="card" id="h-musiba"><div class="head"><div class="num"><span>!</span></div><h2>При утрате, смерти или плохой вести</h2></div>
  <div class="brow"><div class="badge">После беды</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا</p></div><div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Inna lillahi wa inna ilayhi raji'un. Allahumma'-jurni fi musibati, wa akhlif li khayran minha.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Поистине, мы принадлежим Аллаху и к Нему возвращаемся. О Аллах, вознагради меня в моей беде и замени её лучшим.</p></div><p class="src">Источник: Сахих Муслим 918. Кто скажет это, того Аллах вознаградит и даст лучшее.</p></section><section class="card" id="h-pain"><div class="head"><div class="num"><span>!</span></div><h2>При боли</h2></div>
  <div class="brow"><div class="badge">Рука на месте боли</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ <span class="x">×3</span><br>أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ <span class="x">×7</span></p></div><div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">Bismillah (3×) — A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7×).</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">С именем Аллаха. Прибегаю к Аллаху и Его могуществу от зла того, что чувствую и чего опасаюсь.</p></div><p class="src">Источник: Сахих Муслим 2202. Положите руку на место боли, скажите «Бисмиллях» 3 раза и эту мольбу 7 раз.</p></section><section class="card" id="h-sick"><div class="head"><div class="num"><span>!</span></div><h2>При посещении больного</h2></div>
  <div class="brow"><div class="badge">7 раз рядом с ним</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ</p></div><div class="row"><span class="lbl">Транслитерация</span><p class="tr" dir="ltr">As'alullahal-'Azim, Rabbal-'Arshil-'Azim, an yashfiyak.</p></div><div class="row"><span class="lbl">Смысл</span><p class="mn">Прошу Аллаха Великого, Господа великого Трона, исцелить тебя.</p></div><p class="src">Источник: Абу Дауд 3106, ат-Тирмизи 2083; аль-Албани: достоверно. Если не пришёл его срок, Аллах исцелит его.</p></section><section class="card" id="h-hasbuna"><div class="head"><div class="num"><span>!</span></div><h2>При страхе, угрозах или давлении</h2></div>

<p class="intro">安拉的使者<span class="saw">ﷺ</span>说：“你在傍晚和早晨各诵读三遍<b>《忠诚章》</b>和<b>两个求护章</b>（《曙光章》与《世人章》），它们足以护佑你免遭一切。”<small>（艾布·达乌德 5082，提尔米济 3575；阿尔巴尼：良好）</small></p>

  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Allahu la ilaha illa Huwal-Hayyul-Qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma bayna aydihim wa ma khalfahum. Wa la yuhituna bi shay'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifzuhuma, wa Huwal-'Aliyyul-'Azim.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">安拉，除他外绝无应受崇拜的；他是永生不灭的，是维护万物的；瞌睡不能侵犯他，睡眠不能克服他；天地万物都是他的；不经他的许可，谁能在他那里替人说情呢？他知道他们面前的事，和他们身后的事；除他所启示的外，他们绝不能窥测他的玄妙；他的库尔西包罗天地。对天地的维持，不能使他疲倦。他确是至高无上的主，确是至大的主。</p></div><button class="tally" type="button" data-id="kursi" data-target="1"><span class="tick">✓</span><span class="lab" data-do="每读完一遍点这里" data-done="已完成">每读完一遍点这里</span><span class="cn"><span class="tc">0</span>/1</span></button><p class="src">出处: 《黄牛章》2:255。睡前诵读者，整夜直到天亮都有安拉派来的护卫，恶魔不能接近他（《布哈里圣训实录》5010）。早晚诵读的传述：哈基姆《补遗》，阿尔巴尼定为可靠（《劝善与警告·可靠篇》）。</p>
</section>

  <div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Bismillahil-ladhi la yadurru ma'as-mihi shay'un fil-ardi wa la fis-sama'i, wa Huwas-Sami'ul-'Alim.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">奉安拉之名，凭着他的尊名，天地间任何事物都不能造成伤害；他是全聪的，全知的。</p></div><button class="tally" type="button" data-id="bismillah" data-target="3"><span class="tick">✓</span><span class="lab" data-do="每读完一遍点这里" data-done="已完成">每读完一遍点这里</span><span class="cn"><span class="tc">0</span>/3</span></button><p class="src">出处: 艾布·达乌德 5088，提尔米济 3388；阿尔巴尼：可靠。贵重：早晨念三遍者，直到傍晚不会遭遇突然的灾祸；傍晚念三遍者，直到早晨亦然。</p>

<p class="intro" id="family">安拉的使者<span class="saw">ﷺ</span>用这段祈祷为哈桑和侯赛因求护，并说他们的祖先易卜拉欣也曾用它为伊斯玛仪和伊斯哈格求护。<small>（《布哈里圣训实录》3371）</small></p>
<section class="card" id="family-self">

<p class="intro" id="barakah">安拉的使者<span class="saw">ﷺ</span>说：你们任何人在自己身上、财产上或兄弟身上看到令他喜欢的事物时，应当为之祈求吉庆，因为毒眼是真实的。<small>（《艾哈迈德穆斯奈德》、伊本·马哲、《穆宛塔》；阿尔巴尼：可靠）</small></p>
<section class="card"><div class="head"><div class="num"><span>6</span></div><h2>欣赏自己或他人的恩典时</h2></div>

</section></section><section class="view" id="v-help" hidden><div class="sechead"><h2>危难时的祈祷</h2><p>忧虑、灾难、疾病或恐惧时</p></div><section class="card" id="h-yunus"><div class="head"><div class="num"><span>!</span></div><h2>在任何困境中（优努斯的祈祷）</h2></div>
  <div class="brow"><div class="badge">困境时</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّى كُنتُ مِنَ ٱلظَّٰلِمِينَ</p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">La ilaha illa anta, subhanaka, inni kuntu minaz-zalimin.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">除你之外，绝无应受崇拜者，我赞颂你超绝万物，我确是不义的。</p></div><p class="src">出处: 《众先知章》21:87。任何穆斯林以此为任何事祈祷，安拉都会应答。（提尔米济 3505；阿尔巴尼：可靠）</p></section><section class="card" id="h-karb"><div class="head"><div class="num"><span>!</span></div><h2>极度忧愁时</h2></div>
  <div class="brow"><div class="badge">忧愁时</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ</p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">La ilaha illallahul-'Azimul-Halim. La ilaha illallahu Rabbul-'Arshil-'Azim. La ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">除安拉外绝无应受崇拜者，他是伟大的、宽容的。除安拉外绝无应受崇拜者，他是伟大宝座的主。除安拉外绝无应受崇拜者，他是诸天的主、大地的主、尊贵宝座的主。</p></div><p class="src">出处: 《布哈里圣训实录》6346，《穆斯林圣训实录》2730。先知在忧愁时念此祈祷。</p></section><section class="card" id="h-musiba"><div class="head"><div class="num"><span>!</span></div><h2>遭遇损失、死亡或坏消息时</h2></div>
  <div class="brow"><div class="badge">遭难之后</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا</p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Inna lillahi wa inna ilayhi raji'un. Allahumma'-jurni fi musibati, wa akhlif li khayran minha.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">我们确是安拉所有的，我们必定只归依他。主啊！求你因我的灾难而赏赐我，并以更好的补偿我。</p></div><p class="src">出处: 《穆斯林圣训实录》918。念此者，安拉会赏赐他并给予更好的补偿。</p></section><section class="card" id="h-pain"><div class="head"><div class="num"><span>!</span></div><h2>身体疼痛时</h2></div>
  <div class="brow"><div class="badge">手放在疼痛处</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">بِسْمِ اللَّهِ <span class="x">×3</span><br>أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ <span class="x">×7</span></p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Bismillah (3×) — A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (7×).</p></div><div class="row"><span class="lbl">译意</span><p class="mn">奉安拉之名。我求安拉和他的大能护佑我，免遭我所感受和所担心的伤害。</p></div><p class="src">出处: 《穆斯林圣训实录》2202。手放在疼痛处，念“奉安拉之名”三遍，再念此祈祷七遍。</p></section><section class="card" id="h-sick"><div class="head"><div class="num"><span>!</span></div><h2>探望病人时</h2></div>
  <div class="brow"><div class="badge">在病人身边念七遍</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar hadith">أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ</p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">As'alullahal-'Azim, Rabbal-'Arshil-'Azim, an yashfiyak.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">我祈求伟大的安拉——伟大宝座的主——使你痊愈。</p></div><p class="src">出处: 艾布·达乌德 3106，提尔米济 2083；阿尔巴尼：可靠。若其寿限未到，安拉会使他痊愈。</p></section><section class="card" id="h-hasbuna"><div class="head"><div class="num"><span>!</span></div><h2>面对恐惧、威胁或压力时</h2></div>
  <div class="brow"><div class="badge">任何时候</div></div>
  <div class="arbox" dir="rtl" lang="ar"><p class="ar quran">حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ</p></div><div class="row"><span class="lbl">拼读</span><p class="tr" dir="ltr">Hasbunallahu wa ni'mal-wakil.</p></div><div class="row"><span class="lbl">译意</span><p class="mn">安拉使我们满足，他是最优秀的监护者。</p></div><p class="src">出处: 《仪姆兰的家属章》3:173。易卜拉欣被投入火中时、先知受到敌人威胁时都曾这样说。（《布哈里圣训实录》4563）</p></section></section><nav class="bnav"><button type="button" data-v="amal"><span class="ni">📿</span><span class="nl">记念</span></button><button type="button" data-v="prayer"><span class="ni">🕌</span><span class="nl">礼拜</span></button><button type="button" data-v="tasbih"><span class="ni">🔢</span><span class="nl">赞颂</span></button><button type="button" data-v="qibla"><span class="ni">🧭</span><span class="nl">朝向</span></button><button type="button" data-v="help"><span class="ni">🤲</span><span class="nl">危难祈祷</span></button></nav></template>
