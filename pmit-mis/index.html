<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Management Information System Lectures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: subject hub. One column: subject header, then one card per lecture (live or upcoming). */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#141b2d; --muted:#5b6478; --line:#dde2ec;
  --accent:#2f4fd8; --accent-soft:#e8ecfd; --good:#1d7a46; --good-soft:#e3f4ea;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Hind Siliguri","IBM Plex Sans","Noto Sans Bengali",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--surface:#171c2e;--ink:#e8ebf4;--muted:#9aa3b8;--line:#2a3148;--accent:#8ea2ff;--accent-soft:#222b4d;--good:#5fd08f;--good-soft:#163323;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1220;--surface:#171c2e;--ink:#e8ebf4;--muted:#9aa3b8;--line:#2a3148;--accent:#8ea2ff;--accent-soft:#222b4d;--good:#5fd08f;--good-soft:#163323;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
.k{font:500 12.5px var(--f-mono);color:var(--muted)}
h1{font:700 clamp(26px,6.5vw,34px)/1.2 var(--f-display);margin:6px 0 8px;text-wrap:balance}
header p{color:var(--muted);margin:0}
.list{display:grid;gap:12px;margin:22px 0}
.lec{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit}
a.lec:hover{border-color:var(--accent)}
.num{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 22px var(--f-display)}
:root[data-theme="dark"] .num{color:#0e1220}
.lec .t{font-weight:600;font-size:17px;line-height:1.35}
.lec .t small{display:block;font:500 12.5px var(--f-mono);color:var(--muted);margin-bottom:2px}
.lec .d{font-size:14px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chips span.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.arr{font-size:22px;color:var(--muted)}
.lec.soon{opacity:.6;border-style:dashed}
.lec.soon .num{background:var(--line);color:var(--muted)}
.other{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--muted)}
.other a{color:var(--accent);font-weight:600}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 0 32px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="k">PMIT · IIT, Jahangirnagar University</div>
    <h1>Management Information System</h1>
    <p>প্রতিটা লেকচারের সহজ নোট, প্রশ্নোত্তর, পরীক্ষা আর ফ্ল্যাশকার্ড। একটা লেকচার বেছে নিন।</p>
  </header>
  <main class="list" id="list"></main>
  <div class="other">অন্য বিষয়: <a href="../pmit-crypto/">Cryptography &amp; Steganography</a></div>
  <footer>Athir, PMIT 39 · Section A</footer>
</div>
<script>
// Add new lectures here: {n, title, topics, href, q, ch, key}
const LECTURES=[
  {n:1,title:"Introduction to MIS",topics:"MIS কী, ৫টা উপাদান, TPS/MIS/DSS, Manual বনাম Computerized",href:"lecture-01.html",q:43,ch:8,key:"mis01"}
];
function done(key){try{return JSON.parse(localStorage.getItem(key+"-notes")||"[]").length;}catch(e){return 0;}}
function best(key){try{return localStorage.getItem(key+"-best");}catch(e){return null;}}
const html=LECTURES.map(l=>{const d=done(l.key),b=best(l.key);
  return `<a class="lec" href="${l.href}"><span class="num">${l.n}</span><span><span class="t"><small>LECTURE ${String(l.n).padStart(2,"0")}</small>${l.title}</span><span class="d">${l.topics}</span>
  <span class="chips"><span${d===l.ch?' class="done"':''}>নোট ${d}/${l.ch}</span><span>${l.q}টা প্রশ্ন</span>${b!==null?`<span class="done">সেরা স্কোর ${b}%</span>`:""}</span></span><span class="arr">›</span></a>`;}).join("")
  +`<div class="lec soon"><span class="num">${LECTURES.length+1}</span><span><span class="t"><small>LECTURE ${String(LECTURES.length+1).padStart(2,"0")}</small>শিগগিরই আসছে</span><span class="d">পরের লেকচারের স্লাইড পেলেই যোগ হবে</span></span><span></span></div>`;
document.getElementById("list").innerHTML=html;
</script>
</body>
</html>
